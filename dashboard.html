<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>দুর্গাপূজা ব্যবস্থাপনা - ড্যাশবোর্ড</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    /* Table styles and animations */
    th, td { text-align: center; vertical-align: middle; white-space: nowrap; }
    @keyframes autoScroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    .animate-auto-slide { display: flex; width: max-content; animation: autoScroll 20s linear infinite; }
    .animate-auto-slide:hover { animation-play-state: paused; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-amber-50/40 p-3 font-sans pb-20">
  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <div class="bg-gradient-to-b from-amber-100 to-amber-50 p-4 rounded-xl shadow-sm text-center border border-amber-200 mb-4 relative">
      <h1 class="text-xl md:text-2xl font-bold text-orange-700">নেকড়ামারি সর্বজনীন দুর্গোৎসব কমিটি</h1>
      <p class="text-xs md:text-sm text-gray-700 mt-1">স্থাপিত:- ২০০৯ | <strong>Regd.No.:- S0014684</strong></p>
      <p class="text-xs md:text-sm text-gray-700">সাং:- সহরা, পোস্ট:- আদিনা স্টেশন, থানা ও জেলা:- মালদা, পিন:- ৭৩২১২৮</p>
      <p class="text-xs md:text-sm text-gray-800 font-semibold mt-1">📞 <a href="tel:9933371702" class="hover:underline">৯৯৩৩৩৭১৭০২</a></p>
    </div>

    <!-- Quick Menu -->
    <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-200 mb-4">
      <div class="flex justify-between items-center bg-orange-600 text-white p-2.5 rounded-lg shadow-sm cursor-pointer" onclick="toggleQuickMenu()">
        <span class="text-sm font-bold flex items-center gap-1">📊 ড্যাশবোর্ড মেনু</span>
        <div class="flex items-center gap-2">
          <span id="userRoleBadge" class="bg-amber-800 text-[11px] px-2.5 py-1 rounded-full font-semibold shadow-inner">রোল: লোড হচ্ছে...</span>
          <span id="menuArrowIcon" class="text-lg font-bold transition-transform duration-300">▼</span>
        </div>
      </div>
      <div id="quickMenuContent" class="grid grid-cols-4 gap-2 mt-3 transition-all duration-300">
        <!-- LINK TO MEMBER PAGE -->
        <button onclick="window.location.href='member.html'" class="bg-gray-100 text-gray-700 p-2 rounded-lg text-xs font-semibold flex flex-col items-center justify-center gap-1 hover:bg-gray-200 border">👥 সদস্য</button>
        <button onclick="switchTab('subscription')" class="bg-gray-100 text-gray-700 p-2 rounded-lg text-xs font-semibold flex flex-col items-center justify-center gap-1 hover:bg-gray-200 border">💰 চাঁদা</button>
        <button onclick="switchTab('expense')" class="bg-gray-100 text-gray-700 p-2 rounded-lg text-xs font-semibold flex flex-col items-center justify-center gap-1 hover:bg-gray-200 border">💵 খরচ</button>
        <button onclick="switchTab('booking')" class="bg-gray-100 text-gray-700 p-2 rounded-lg text-xs font-semibold flex flex-col items-center justify-center gap-1 hover:bg-gray-200 border">🎫 বুকিং</button>
        <button onclick="switchTab('sales')" class="bg-gray-100 text-gray-700 p-2 rounded-lg text-xs font-semibold flex flex-col items-center justify-center gap-1 hover:bg-gray-200 border">🛒 বিক্রয়</button>
        <button onclick="switchTab('treasurer')" class="bg-gray-100 text-gray-700 p-2 rounded-lg text-xs font-semibold flex flex-col items-center justify-center gap-1 hover:bg-gray-200 border col-span-2">📊 কোষাধ্যক্ষ</button>
        <button onclick="switchTab('settings')" class="bg-gray-100 text-gray-700 p-2 rounded-lg text-xs font-semibold flex flex-col items-center justify-center gap-1 hover:bg-gray-200 border">⚙️ সেটিংস</button>
      </div>
    </div>

    <!-- Dashboard Section -->
    <div id="section-dashboard" class="space-y-3">
      <div class="bg-amber-600 text-white p-3 rounded-xl font-bold flex justify-between items-center shadow-sm cursor-pointer" onclick="toggleOfficeBearersMenu()">
        <span class="flex items-center gap-1">👥 কমিটির প্রধান পদাধিকারী</span>
        <span id="officeBearersArrowIcon" class="text-lg font-bold transition-transform duration-300">▼</span>
      </div>
      <div id="officeBearersContent" class="bg-white p-3 rounded-xl shadow-sm border border-amber-200 overflow-hidden relative"></div>

      <div class="grid grid-cols-2 gap-3">
        <!-- LINK TO MEMBER PAGE -->
        <div onclick="window.location.href='member.html'" class="bg-blue-600 text-white p-4 rounded-xl shadow-md cursor-pointer hover:bg-blue-700 transition flex flex-col items-center justify-center text-center">
          <div class="text-2xl mb-1">👥</div>
          <div class="text-xs font-medium opacity-90">মোট সদস্য</div>
          <div class="text-2xl font-bold mt-1" id="dashTotalMembers">0</div>
        </div>
        <div onclick="switchTab('subscription')" class="bg-emerald-600 text-white p-4 rounded-xl shadow-md cursor-pointer hover:bg-emerald-700 transition flex flex-col items-center justify-center text-center">
          <div class="text-2xl mb-1">💰</div>
          <div class="text-xs font-medium opacity-90">মোট চাঁদা</div>
          <div class="text-2xl font-bold mt-1" id="dashTotalSubAmount">₹0</div>
        </div>
      </div>
    </div>

    <!-- Other Sections (Subscription, Settings etc. will remain here to function normally) -->
    <!-- (এখানে আপনার পূর্বের চাঁদা, সেটিংস, খরচ, বুকিং মডিউলগুলো থাকবে। স্পেসের জন্য পুরো কোড দেওয়া হলো না, আপনি আপনার আগের কোড থেকে <div id="section-subscription"> থেকে শুরু করে সেটিংসের শেষ পর্যন্ত অংশটুকু কপি করে এখানে বসিয়ে দেবেন।) -->
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, setPersistence, browserSessionPersistence, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, getDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyByG-eBGnsUMX1zchs8sJV9MNZL-Sx0Nqs",
      authDomain: "durgapuja-2026.firebaseapp.com",
      projectId: "durgapuja-2026",
      storageBucket: "durgapuja-2026.firebasestorage.app",
      messagingSenderId: "625976130920",
      appId: "1:625976130920:web:60190b21f1c7563cdd2add",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    setPersistence(auth, browserSessionPersistence);
    const db = getFirestore(app);
    
    let allMembersData = [];
    const ADMIN_EMAIL = "bappasarkar1173@gmail.com";

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        if (user.email === ADMIN_EMAIL) window.currentUserRole = "admin";
        else window.currentUserRole = "user";
        
        loadMembersForDashboard(); // Only loading data for dashboard counters
      } else {
        window.location.replace("index.html");
      }
    });

    function loadMembersForDashboard() {
      onSnapshot(collection(db, "members"), (snapshot) => {
        allMembersData = [];
        snapshot.forEach((docSnap) => { allMembersData.push({ id: docSnap.id, ...docSnap.data() }); });
        document.getElementById("dashTotalMembers").innerText = allMembersData.length;
        renderOfficeBearers(allMembersData);
      });
    }

    function renderOfficeBearers(members) {
      const container = document.getElementById("officeBearersContent");
      if (!container) return;
      container.innerHTML = "";
      const officeBearers = members.filter((m) => m.role && m.role !== "সাধারণ সদস্য");
      if (officeBearers.length === 0) {
        container.innerHTML = `<p class="text-xs text-gray-500 text-center py-2">কোনো প্রধান পদাধিকারী নেই।</p>`;
        return;
      }
      const sliderWrapper = document.createElement("div");
      sliderWrapper.className = "animate-auto-slide gap-3";
      for (let i = 0; i < 2; i++) {
        officeBearers.forEach((person) => {
          const mobileLink = person.mobile && person.mobile !== "-" ? `<a href="tel:${person.mobile}" class="font-bold text-orange-700">📞 ${person.mobile}</a>` : `<span class="text-gray-400">নম্বর নেই</span>`;
          const card = document.createElement("div");
          card.className = "flex items-center justify-between bg-amber-50/80 p-2.5 rounded-lg border border-amber-200 text-xs shrink-0 min-w-[260px] shadow-sm";
          card.innerHTML = `<div><span class="font-bold text-gray-800">${person.name}</span><span class="bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full text-[10px] ml-2">${person.role}</span></div><div class="ml-4">${mobileLink}</div>`;
          sliderWrapper.appendChild(card);
        });
      }
      container.appendChild(sliderWrapper);
    }
    
    window.toggleOfficeBearersMenu = function() {
        const content = document.getElementById("officeBearersContent");
        const arrow = document.getElementById("officeBearersArrowIcon");
        content.classList.toggle("hidden");
        arrow.style.transform = content.classList.contains("hidden") ? "rotate(-90deg)" : "rotate(0deg)";
    }
  </script>
</body>
</html>
