<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>টিকিট বিক্রয় ব্যবস্থাপনা</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 pb-10">

  <!-- Header Section -->
  <header class="bg-orange-600 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-lg font-bold flex items-center gap-2">
        🎟️ টিকিট বিক্রয় রেজিস্টার
      </h1>
      <button onclick="openAddSalesModal()" class="bg-white text-orange-600 px-3 py-1.5 rounded-xl text-xs font-bold shadow hover:bg-orange-50 transition">
        + নতুন এন্ট্রি
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto p-3 sm:p-4">
    
    <!-- Summary Cards -->
    <div class="grid grid-cols-3 gap-2 mb-4 text-center">
      <div class="bg-white p-3 rounded-2xl border border-orange-100 shadow-sm">
        <p class="text-[11px] text-gray-500 font-semibold">মোট বিক্রীত টিকিট</p>
        <p id="totalTicketsSoldDisplay" class="text-base font-bold text-orange-600">0</p>
      </div>
      <div class="bg-white p-3 rounded-2xl border border-emerald-100 shadow-sm">
        <p class="text-[11px] text-gray-500 font-semibold">মোট বিক্রি (₹)</p>
        <p id="totalSalesAmountDisplay" class="text-base font-bold text-emerald-600">₹0</p>
      </div>
      <div class="bg-white p-3 rounded-2xl border border-red-100 shadow-sm">
        <p class="text-[11px] text-gray-500 font-semibold">মোট বাকি (₹)</p>
        <p id="totalDueAmountDisplay" class="text-base font-bold text-red-600">₹0</p>
      </div>
    </div>

    <!-- Filter & Search -->
    <div class="bg-white p-3 rounded-2xl shadow-sm border mb-4 flex gap-2">
      <input type="text" id="salesSearchInput" oninput="filterSalesTable()" placeholder="নাম বা বই নম্বর দিয়ে খুঁজুন..." class="w-full p-2 border rounded-xl text-xs">
    </div>

    <!-- Sales Table / List -->
    <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs border-collapse">
          <thead class="bg-gray-100 text-gray-700 uppercase border-b">
            <tr>
              <th class="p-2.5">তারিখ</th>
              <th class="p-2.5">ক্রেতা/সদস্য</th>
              <th class="p-2.5">বই নম্বর</th>
              <th class="p-2.5 text-center">পরিমাণ</th>
              <th class="p-2.5 text-right">মোট (₹)</th>
              <th class="p-2.5 text-right">জমা (₹)</th>
              <th class="p-2.5 text-center">অ্যাকশন</th>
            </tr>
          </thead>
          <tbody id="salesTableBody" class="divide-y text-gray-700">
            <tr>
              <td colspan="7" class="text-center py-6 text-gray-400">ডাটা লোড হচ্ছে...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- ➕ বিক্রয় এন্ট্রি পপআপ মডাল -->
  <div id="salesModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-3 z-50">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl border border-amber-200 p-4 relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeSalesModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 font-bold">✕</button>
      <h3 class="text-base font-bold text-orange-700 text-center mb-3" id="salesModalTitle">নতুন টিকিট বিক্রয়</h3>
      
      <div class="grid grid-cols-2 gap-2 bg-gray-100 p-1 rounded-xl mb-3">
        <button type="button" id="saleTypeMemberBtn" onclick="setSaleType('member')" class="py-1.5 text-xs font-bold rounded-lg transition bg-white text-orange-600 shadow-sm">সদস্য</button>
        <button type="button" id="saleTypeOtherBtn" onclick="setSaleType('other')" class="py-1.5 text-xs font-bold rounded-lg transition text-gray-600">অন্যান্য</button>
      </div>

      <div class="space-y-3 text-xs">
        <!-- Member / Other Select -->
        <div id="memberSelectBox" class="relative">
          <label class="block font-bold text-gray-600 mb-1">নাম নির্বাচন করুন বা নতুন লিখুন *</label>
          <input id="saleMemberSearch" type="text" placeholder="নাম, মোবাইল বা নম্বর দিয়ে খুঁজুন..." oninput="searchMembers(this.value)" class="w-full p-2 border rounded-lg">
          <div id="memberSearchResults" class="hidden absolute left-0 right-0 z-20 bg-white border rounded-lg shadow-lg max-h-36 overflow-y-auto mt-1"></div>
        </div>

        <div id="otherNameBox" class="hidden">
          <label class="block font-bold text-gray-600 mb-1">ক্রেতার নাম *</label>
          <input id="saleCustomerName" type="text" placeholder="নাম লিখুন" class="w-full p-2 border rounded-lg">
        </div>

        <!-- Date & Book No -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold text-gray-600 mb-1">তারিখ *</label>
            <input type="date" id="saleDate" class="w-full p-2 border rounded-lg">
          </div>
          <div>
            <label class="block font-bold text-gray-600 mb-1">বই নম্বর *</label>
            <input id="saleBookNo" type="text" placeholder="যেমন: B001" oninput="checkBookDetails()" class="w-full p-2 border rounded-lg">
          </div>
        </div>
        <!-- বুকিং থেকে বইয়ের বিস্তারিত দেখানোর জন্য -->
        <div id="bookDetailsDisplay" class="text-[11px] text-blue-600 hidden -mt-1 font-semibold"></div>

        <!-- Checkbox for Ticket Numbers -->
        <div class="flex items-center gap-2 mb-1">
          <input type="checkbox" id="useTicketNumbers" checked onchange="toggleTicketNumbers()" class="w-4 h-4 text-orange-600 border-gray-300 rounded focus:ring-orange-500 cursor-pointer">
          <label for="useTicketNumbers" class="font-bold text-gray-700 cursor-pointer">টিকিট নম্বর ব্যবহার করুন</label>
        </div>

        <!-- Ticket Number Inputs -->
        <div id="ticketNumberFields" class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold text-gray-600 mb-1">টিকিট নম্বর থেকে</label>
            <input id="saleStartTicket" type="number" oninput="calcSaleQty()" placeholder="শুরুর টিকিট নম্বর" class="w-full p-2 border rounded-lg">
          </div>
          <div>
            <label class="block font-bold text-gray-600 mb-1">টিকিট নম্বর পর্যন্ত</label>
            <input id="saleEndTicket" type="number" oninput="calcSaleQty()" placeholder="শেষ টিকিট নম্বর" class="w-full p-2 border rounded-lg">
          </div>
        </div>

        <!-- Quantity & Price -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold text-gray-600 mb-1">বিক্রীত পরিমাণ *</label>
            <input id="saleQuantity" type="number" readonly oninput="calcSaleQty()" placeholder="0" class="w-full p-2 border rounded-lg bg-gray-100 font-bold text-orange-700">
          </div>
          <div>
            <label class="block font-bold text-gray-600 mb-1">প্রতি টিকিটের মূল্য (₹) *</label>
            <input id="salePricePerTicket" type="number" value="100" oninput="calcSaleQty()" class="w-full p-2 border rounded-lg">
          </div>
        </div>

        <div>
          <label class="block font-bold text-gray-600 mb-1">মোট টাকা (₹)</label>
          <input id="saleTotalAmount" type="number" readonly class="w-full p-2 border rounded-lg bg-gray-100 font-bold text-emerald-700">
        </div>

        <!-- Payment Info -->
        <div class="mt-4 pt-3 border-t border-gray-200">
           <h4 class="font-bold text-gray-800 mb-2">পেমেন্ট তথ্য</h4>
           <div class="mb-2">
              <label class="block font-bold text-gray-600 mb-1">কার কাছে জমা *</label>
              <!-- ডায়নামিক কোষাধ্যক্ষের নাম এখানে আসবে, চাইলে পাল্টানো যাবে -->
              <input id="saleCollector" type="text" placeholder="নাম লিখুন..." class="w-full p-2 border rounded-lg font-semibold bg-orange-50 border-orange-200 text-gray-800">
              <p class="text-[10px] text-orange-700 mt-1" id="collectorHintText"></p>
           </div>

           <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block font-bold text-gray-600 mb-1">জমা টাকা (₹)</label>
                <input id="salePaidAmount" type="number" oninput="calcDueAmount()" placeholder="জমা টাকার পরিমাণ" class="w-full p-2 border rounded-lg">
              </div>
              <div>
                <label class="block font-bold text-gray-600 mb-1">বাকি টাকা (₹)</label>
                <input id="saleDueDisplay" type="number" readonly class="w-full p-2 border rounded-lg bg-gray-100 text-red-600 font-bold">
              </div>
           </div>
        </div>

        <div class="grid grid-cols-2 gap-2 pt-3">
          <button type="button" onclick="closeSalesModal()" class="w-full bg-white border text-gray-700 py-2 rounded-xl font-bold">বাতিল</button>
          <button type="button" onclick="saveSalesForm()" id="saveSaleBtn" class="w-full bg-black text-white py-2 rounded-xl font-bold hover:bg-gray-800">যোগ করুন</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // ⚠️ আপনার নিজস্ব Firebase কনফিগারেশন কী বসান
    const firebaseConfig = {
      // apiKey: "YOUR_API_KEY",
      // authDomain: "YOUR_AUTH_DOMAIN",
      // projectId: "YOUR_PROJECT_ID",
      // storageBucket: "YOUR_STORAGE_BUCKET",
      // messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      // appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let salesData = [];
    let paymentsData = [];
    let membersData = [];
    let bookingsData = [];
    let currentSaleType = "member";
    let editSaleId = "";
    window.currentSelectedBookingId = null;
    window.currentBookingSold = 0;

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        loadMembers();
        loadBookings();
        loadSales();
        loadPayments();
      }
    });

    // ১. ডাটা লোডিং
    function loadMembers() {
      onSnapshot(collection(db, "members"), snap => {
        membersData = [];
        snap.forEach(d => membersData.push({ id: d.id, ...d.data() }));
      });
    }

    function loadBookings() {
      onSnapshot(collection(db, "bookings"), snap => {
        bookingsData = [];
        snap.forEach(d => bookingsData.push({ id: d.id, ...d.data() }));
      });
    }

    function loadSales() {
      onSnapshot(collection(db, "sales"), snap => {
        salesData = [];
        snap.forEach(d => salesData.push({ id: d.id, ...d.data() }));
        renderSales();
      });
    }

    function loadPayments() {
      onSnapshot(collection(db, "payments"), snap => {
        paymentsData = [];
        snap.forEach(d => paymentsData.push({ id: d.id, ...d.data() }));
        renderSales();
      });
    }

    // ২. কোষাধ্যক্ষের নাম সদস্য তালিকা থেকে ডাইনামিক খোঁজা
    window.getTreasurerName = function() {
      if (!membersData || membersData.length === 0) return "";
      const treasurer = membersData.find(m => 
          (m.designation && m.designation.includes("পূজা কোষাধ্যক্ষ")) ||
          (m.role && m.role.includes("পূজা কোষাধ্যক্ষ")) ||
          (m.post && m.post.includes("পূজা কোষাধ্যক্ষ"))
      );
      return treasurer ? treasurer.name : "";
    };

    // ৩. মডাল হ্যান্ডলার
    window.openAddSalesModal = function() {
      editSaleId = "";
      window.currentSelectedBookingId = null;
      document.getElementById("salesModalTitle").innerText = "নতুন টিকিট বিক্রয়";
      
      document.getElementById("saleMemberSearch").value = "";
      document.getElementById("saleCustomerName").value = "";
      document.getElementById("saleBookNo").value = "";
      document.getElementById("bookDetailsDisplay").classList.add("hidden");
      
      document.getElementById("useTicketNumbers").checked = true;
      toggleTicketNumbers(); 

      document.getElementById("saleQuantity").value = "";
      document.getElementById("saleTotalAmount").value = "";
      document.getElementById("salePaidAmount").value = "";
      document.getElementById("saleDueDisplay").value = "";
      document.getElementById("saleDate").value = new Date().toISOString().split('T')[0];
      
      // ডাইনামিক কোষাধ্যক্ষের নাম সেট করা
      const defaultCollector = window.getTreasurerName();
      document.getElementById("saleCollector").value = defaultCollector;
      const hintText = document.getElementById("collectorHintText");
      if(defaultCollector) {
          hintText.innerText = "⭐️ (সদস্য তালিকা থেকে পূজা কোষাধ্যক্ষ নির্বাচিত, চাইলে পরিবর্তন করতে পারেন)";
      } else {
          hintText.innerText = "⭐️ (কার কাছে জমা দিয়েছেন তার নাম লিখুন)";
      }

      setSaleType("member");

      const m = document.getElementById("salesModal");
      m.classList.remove("hidden"); m.classList.add("flex");
    };

    window.closeSalesModal = function() {
      document.getElementById("salesModal").classList.add("hidden");
      document.getElementById("salesModal").classList.remove("flex");
    };

    window.setSaleType = function(type) {
      currentSaleType = type;
      const mBtn = document.getElementById("saleTypeMemberBtn");
      const oBtn = document.getElementById("saleTypeOtherBtn");
      const mBox = document.getElementById("memberSelectBox");
      const oBox = document.getElementById("otherNameBox");
      
      if (type === "member") {
        mBtn.className = "py-1.5 text-xs font-bold rounded-lg transition bg-white text-orange-600 shadow-sm";
        oBtn.className = "py-1.5 text-xs font-bold rounded-lg transition text-gray-600";
        mBox.classList.remove("hidden");
        oBox.classList.add("hidden");
      } else {
        oBtn.className = "py-1.5 text-xs font-bold rounded-lg transition bg-white text-orange-600 shadow-sm";
        mBtn.className = "py-1.5 text-xs font-bold rounded-lg transition text-gray-600";
        oBox.classList.remove("hidden");
        mBox.classList.add("hidden");
      }
    };

    // ৪. সদস্য নাম খোঁজা (Autosuggest)
    window.searchMembers = function(query) {
      const resultsDiv = document.getElementById("memberSearchResults");
      if(!query.trim()) { resultsDiv.classList.add("hidden"); return; }
      
      const filtered = membersData.filter(m => 
        (m.name || "").toLowerCase().includes(query.toLowerCase()) || 
        (m.phone || "").includes(query)
      );

      if(filtered.length === 0) {
        resultsDiv.classList.add("hidden");
        return;
      }

      resultsDiv.innerHTML = filtered.map(m => `
        <div onclick="selectMember('${m.name}')" class="p-2 hover:bg-orange-50 cursor-pointer border-b text-xs flex justify-between">
          <span class="font-bold text-gray-800">${m.name}</span>
          <span class="text-gray-500">${m.phone || ''}</span>
        </div>
      `).join('');
      resultsDiv.classList.remove("hidden");
    };

    window.selectMember = function(name) {
      document.getElementById("saleMemberSearch").value = name;
      document.getElementById("memberSearchResults").classList.add("hidden");
    };

    // ৫. টিকিট নম্বর ও বুকিং লজিক
    window.toggleTicketNumbers = function() {
      const isChecked = document.getElementById("useTicketNumbers").checked;
      const tFields = document.getElementById("ticketNumberFields");
      const qtyField = document.getElementById("saleQuantity");

      if(isChecked) {
          tFields.classList.remove("hidden");
          qtyField.readOnly = true;
          qtyField.classList.add("bg-gray-100");
      } else {
          tFields.classList.add("hidden");
          qtyField.readOnly = false;
          qtyField.classList.remove("bg-gray-100");
          document.getElementById("saleStartTicket").value = "";
          document.getElementById("saleEndTicket").value = "";
      }
      calcSaleQty();
    };

    window.checkBookDetails = function() {
      const bookNo = document.getElementById("saleBookNo").value.trim();
      const display = document.getElementById("bookDetailsDisplay");
      if(!bookNo) { display.classList.add("hidden"); window.currentSelectedBookingId = null; return; }

      const book = bookingsData.find(b => (b.bookNo || "").toLowerCase() === bookNo.toLowerCase());
      if(book) {
          const total = Number(book.quantity || 0);
          const sold = Number(book.sold || 0);
          const remaining = Math.max(0, total - sold);
          display.innerHTML = `বুকিং তথ্য: বরাদ্দ: ${total} | বিক্রীত: ${sold} | <b>বাকি: ${remaining}</b>`;
          display.classList.remove("hidden");
          window.currentSelectedBookingId = book.id;
          window.currentBookingSold = sold;
      } else {
          display.innerHTML = `<span class="text-red-500">এই বইটি বুকিং লিস্টে পাওয়া যায়নি!</span>`;
          display.classList.remove("hidden");
          window.currentSelectedBookingId = null;
      }
    };

    // ৬. গণনার হিসাব
    window.calcSaleQty = function() {
      const price = parseInt(document.getElementById("salePricePerTicket").value) || 100;
      const isChecked = document.getElementById("useTicketNumbers").checked;
      
      if(isChecked) {
          const start = parseInt(document.getElementById("saleStartTicket").value) || 0;
          const end = parseInt(document.getElementById("saleEndTicket").value) || 0;
          if (end >= start && start > 0) {
            const qty = end - start + 1;
            document.getElementById("saleQuantity").value = qty;
            document.getElementById("saleTotalAmount").value = qty * price;
          } else {
            document.getElementById("saleQuantity").value = "";
            document.getElementById("saleTotalAmount").value = "";
          }
      } else {
          const qty = parseInt(document.getElementById("saleQuantity").value) || 0;
          document.getElementById("saleTotalAmount").value = qty * price;
      }
      calcDueAmount();
    };

    window.calcDueAmount = function() {
      const total = parseInt(document.getElementById("saleTotalAmount").value) || 0;
      const paid = parseInt(document.getElementById("salePaidAmount").value) || 0;
      document.getElementById("saleDueDisplay").value = Math.max(0, total - paid);
    };

    // ৭. সেভ করা
    window.saveSalesForm = async function() {
      const btn = document.getElementById("saveSaleBtn");
      btn.disabled = true;
      try {
        let name = "";
        if (currentSaleType === "member") {
          name = document.getElementById("saleMemberSearch").value.trim();
          if (!name) { alert("দয়া করে সদস্যের নাম লিখুন বা নির্বাচন করুন"); btn.disabled = false; return; }
        } else {
          name = document.getElementById("saleCustomerName").value.trim();
          if(!name) { alert("ক্রেতার নাম লিখুন"); btn.disabled = false; return; }
        }

        const date = document.getElementById("saleDate").value;
        const bookNo = document.getElementById("saleBookNo").value.trim();
        
        const isChecked = document.getElementById("useTicketNumbers").checked;
        const startTicket = isChecked ? (parseInt(document.getElementById("saleStartTicket").value) || 0) : "";
        const endTicket = isChecked ? (parseInt(document.getElementById("saleEndTicket").value) || 0) : "";
        
        const quantity = parseInt(document.getElementById("saleQuantity").value) || 0;
        const pricePerTicket = parseInt(document.getElementById("salePricePerTicket").value) || 100;
        const totalAmount = parseInt(document.getElementById("saleTotalAmount").value) || 0;
        const initialPaid = parseInt(document.getElementById("salePaidAmount").value) || 0;
        const collector = document.getElementById("saleCollector").value.trim();

        if(!date || !bookNo || quantity <= 0) {
          alert("সব ঘর সঠিকভাবে পূরণ করুন (পরিমাণ 0 হতে পারে না)");
          btn.disabled = false; return;
        }

        if(initialPaid > 0 && !collector) {
          alert("কার কাছে জমা দিয়েছেন তার নাম লিখুন!");
          btn.disabled = false; return;
        }

        const payload = {
          type: currentSaleType,
          name, date, bookNo, startTicket, endTicket,
          hasTicketNumbers: isChecked,
          quantity, pricePerTicket, totalAmount, initialPaid,
          timestamp: Date.now()
        };

        if (editSaleId) {
          await updateDoc(doc(db, "sales", editSaleId), payload);
        } else {
          const docRef = await addDoc(collection(db, "sales"), payload);
          
          if (initialPaid > 0) {
            await addDoc(collection(db, "payments"), {
              saleId: docRef.id,
              customerName: name,
              amount: initialPaid,
              date,
              collector: collector,
              note: "প্রাথমিক পেমেন্ট",
              timestamp: Date.now()
            });
          }
          
          // বুকিং-এর বিক্রি হওয়া পরিমাণ আপডেট
          if (window.currentSelectedBookingId) {
               const newSold = window.currentBookingSold + quantity;
               await updateDoc(doc(db, "bookings", window.currentSelectedBookingId), {
                   sold: newSold
               });
          }
        }
        closeSalesModal();
      } catch(e) {
        alert("ত্রুটি: " + e.message);
      } finally {
        btn.disabled = false;
      }
    };

    // ৮. তালিকা প্রদর্শন (Render Sales Table)
    function renderSales() {
      const tbody = document.getElementById("salesTableBody");
      if(!salesData || salesData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-gray-400">কোনো বিক্রয় রেকর্ড পাওয়া যায়নি</td></tr>`;
        document.getElementById("totalTicketsSoldDisplay").innerText = "0";
        document.getElementById("totalSalesAmountDisplay").innerText = "₹0";
        document.getElementById("totalDueAmountDisplay").innerText = "₹0";
        return;
      }

      let totTickets = 0, totSales = 0, totPaid = 0;

      tbody.innerHTML = salesData.map(sale => {
        totTickets += Number(sale.quantity || 0);
        totSales += Number(sale.totalAmount || 0);

        // মোট কত টাকা জমা পড়েছে
        const relatedPayments = paymentsData.filter(p => p.saleId === sale.id);
        const paidSum = relatedPayments.reduce((acc, p) => acc + Number(p.amount || 0), Number(sale.initialPaid || 0));
        totPaid += paidSum;
        const due = Math.max(0, Number(sale.totalAmount || 0) - paidSum);

        return `
          <tr class="hover:bg-orange-50/50 transition">
            <td class="p-2.5 font-medium">${sale.date || ''}</td>
            <td class="p-2.5">
              <span class="font-bold text-gray-800">${sale.name || ''}</span>
              <span class="text-[10px] block text-gray-400">${sale.type === 'member' ? 'সদস্য' : 'অন্যান্য'}</span>
            </td>
            <td class="p-2.5 font-semibold text-gray-700">${sale.bookNo || ''}</td>
            <td class="p-2.5 text-center font-bold text-orange-600">${sale.quantity || 0} টি</td>
            <td class="p-2.5 text-right font-bold text-gray-800">₹${sale.totalAmount || 0}</td>
            <td class="p-2.5 text-right font-bold text-emerald-600">₹${paidSum}</td>
            <td class="p-2.5 text-center">
              <button onclick="deleteSale('${sale.id}')" class="text-red-500 hover:text-red-700 font-bold px-2 py-1 bg-red-50 rounded-lg">মুছুন</button>
            </td>
          </tr>
        `;
      }).join('');

      document.getElementById("totalTicketsSoldDisplay").innerText = totTickets;
      document.getElementById("totalSalesAmountDisplay").innerText = `₹${totSales}`;
      document.getElementById("totalDueAmountDisplay").innerText = `₹${Math.max(0, totSales - totPaid)}`;
    }

    // ৯. ফিল্টার ও ডিলেট
    window.filterSalesTable = function() {
      const q = document.getElementById("salesSearchInput").value.toLowerCase();
      const rows = document.querySelectorAll("#salesTableBody tr");
      rows.forEach(row => {
        const text = row.innerText.toLowerCase();
        row.style.display = text.includes(q) ? "" : "none";
      });
    };

    window.deleteSale = async function(id) {
      if(confirm("আপনি কি সত্যিই এই বিক্রি রেকর্ডটি মুছে ফেলতে চান?")) {
        try {
          await deleteDoc(doc(db, "sales", id));
        } catch(e) { alert("মুছে ফেলা সম্ভব হয়নি: " + e.message); }
      }
    };
  </script>
</body>
</html>
