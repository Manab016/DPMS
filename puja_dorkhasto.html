/* ===== Unified A4 Preview Geometry =====
   The page is always 794x1123 CSS px (A4 at 96dpi).
   Mobile/desktop only scale this same page visually; text metrics never change.
*/
#previewModal{display:flex;align-items:center;justify-content:center}
#previewModal.hidden{display:none}
#previewModal > div{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#previewModal .preview-box{width:min(900px,96vw);max-width:96vw;height:min(96vh,900px);max-height:96vh;overflow:hidden;display:flex;flex-direction:column}
#previewModal .preview-scroll{width:100%;flex:1 1 auto;min-height:0;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:6px 10px 12px}
#previewModal .a4{width:794px;height:1123px;min-width:794px;min-height:1123px;flex:0 0 794px;margin:0 auto;box-shadow:0 2px 14px rgba(0,0,0,.2);transform-origin:top center}
#previewModal .pad-image{width:100%;height:100%;object-fit:fill}
#previewModal .pad-letter{top:237px;left:94px;font-size:16px}
#previewModal .pad-date{top:237px;right:60px;font-size:16px}

#previewModal .bodytext{font-size:16px;line-height:1.45}
#previewModal .signature{margin-top:52px;font-size:16px}
@media(max-width:600px){
 #previewModal{padding:4px!important}
 #previewModal .preview-box{width:100%;max-width:100%;height:calc(100vh - 8px);max-height:calc(100vh - 8px);border-radius:10px}
 #previewModal .preview-scroll{max-height:calc(100vh - 55px);overflow:auto;padding:2px}
}

/* ===== Preserve real bold/normal formatting in Live Preview + Print =====
   Normal document text is regular weight. Only semantic <b>/<strong> text,
   or explicitly bold editor spans, is rendered bold. ===== */
#pvText, #printText, #pvText *, #printText *{font-weight:400;}
#pvText b, #pvText strong, #printText b, #printText strong{font-weight:700;}
#pvText [style*="font-weight:700"], #pvText [style*="font-weight:bold"],
#printText [style*="font-weight:700"], #printText [style*="font-weight:bold"]{font-weight:700;}
#pvText [style*="font-weight:800"], #pvText [style*="font-weight:900"],
#printText [style*="font-weight:800"], #printText [style*="font-weight:900"]{font-weight:800;}
#pvText .data-highlight, #printText .data-highlight{font-weight:400;}

/* ===== Exact manual text + tighter document spacing ===== */
#pvText,#printText{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
#pvText{margin:0} 
#pvText.manual-rich{font-weight:400;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}

#pvText.manual-rich b,#pvText.manual-rich strong{font-weight:800}

/* Manual rich-text must keep each selected part's own formatting. */
#pvText.manual-rich,#printText.manual-rich{font-weight:400}
#pvText.manual-rich p,#pvText.manual-rich div,#pvText.manual-rich h1,#pvText.manual-rich h2,#pvText.manual-rich h3,#pvText.manual-rich h4,#pvText.manual-rich h5,#pvText.manual-rich h6,#printText.manual-rich p,#printText.manual-rich div,#printText.manual-rich h1,#printText.manual-rich h2,#printText.manual-rich h3,#printText.manual-rich h4,#printText.manual-rich h5,#printText.manual-rich h6{margin:0;padding:0}
#pvText.manual-rich b,#pvText.manual-rich strong,#printText.manual-rich b,#printText.manual-rich strong{font-weight:800}
#pvText.manual-rich [style*="font-weight:700"],#pvText.manual-rich [style*="font-weight:800"],#pvText.manual-rich [style*="font-weight:bold"],#printText.manual-rich [style*="font-weight:700"],#printText.manual-rich [style*="font-weight:800"],#printText.manual-rich [style*="font-weight:bold"]{font-weight:700}
#pvText.manual-rich [style*="font-weight:400"],#printText.manual-rich [style*="font-weight:400"]{font-weight:400}
.all-text{white-space:pre-wrap}.manual-rich-text{font-weight:400}.manual-rich-text b,.manual-rich-text strong{font-weight:800}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyByG-eBGnsUMX1zchs8sJV9MNZL-Sx0Nqs",
  authDomain: "durgapuja-2026.firebaseapp.com",
  projectId: "durgapuja-2026",
  storageBucket: "durgapuja-2026.firebasestorage.app",
  messagingSenderId: "625976130920",
  appId: "1:625976130920:web:60190b21f1c7563cdd2add"
};

const dpmsFirebaseApp = initializeApp(firebaseConfig);
const dpmsAuth = getAuth(dpmsFirebaseApp);
const dpmsDb = getFirestore(dpmsFirebaseApp);
window.dpmsFirebase = { auth: dpmsAuth, db: dpmsDb, ready: false, user: null };

window.firestoreSavePujaDorkhasto = async function(formsData, savedApplications) {
  const user = window.dpmsFirebase.user;
  if (!user) throw new Error("Firebase লগইন পাওয়া যায়নি। আগে Dashboard-এ লগইন করুন।");
  const payload = {
    forms: formsData,
    updatedAt: Date.now(),
    updatedBy: user.uid,
    updatedByEmail: user.email || ""
  };
  if (Array.isArray(savedApplications)) payload.savedApplications = savedApplications;
  await setDoc(doc(dpmsDb, "puja_dorkhasto", "main"), payload, { merge: true });
};

async function loadFromFirestore() {
  const user = window.dpmsFirebase.user;
  if (!user) return;
  try {
    const snap = await getDoc(doc(dpmsDb, "puja_dorkhasto", "main"));
    if (snap.exists()) {
      const cloudSavedApplications = snap.data().savedApplications;
      if (Array.isArray(cloudSavedApplications)) {
        localStorage.setItem("puja_saved_applications_v2", JSON.stringify(cloudSavedApplications));
      }
      const formsData = snap.data().forms || {};
      Object.keys(formsData).forEach(id => {
        localStorage.setItem("puja_dorkhasto_" + id, JSON.stringify(formsData[id] || {}));
      });
    }
    window.dpmsFirebase.ready = true;
    window.dispatchEvent(new CustomEvent("pujaFirestoreReady"));
    if (typeof buildTabs === "function") buildTabs();
    if (typeof buildForm === "function") buildForm();
  } catch (e) {
    console.error("Firestore load failed:", e);
    window.dpmsFirebase.ready = true;
    window.dispatchEvent(new CustomEvent("pujaFirestoreReady"));
  }
}

onAuthStateChanged(dpmsAuth, async user => {
  window.dpmsFirebase.user = user || null;
  if (user) await loadFromFirestore();
  else {
    window.dpmsFirebase.ready = true;
    window.dispatchEvent(new CustomEvent("pujaFirestoreReady"));
  }
});
</script>

function collect(id){
 const f=forms.find(x=>x.id===id),d={};
 if(!f) return d;
 f.fields.forEach(x=>{const e=document.getElementById(id+"_"+x[0]);d[x[0]]=e?e.value.trim():""});
 const mv=document.getElementById(id+"_manualText");
 if(mv && mv.isContentEditable){ d.manualHtml=mv.innerHTML; d.manualText=mv.innerText; } else { d.manualText=mv?mv.value:""; }
 const old=get(id);
 d.manualHtml=d.manualHtml || old.manualHtml || "";
 d.manualText=d.manualText ?? old.manualText ?? "";
 const modes=document.querySelectorAll('input[name="writeMode_'+id+'"]');
 d.writeMode = id==="manual" ? "manual" : ([...modes].find(x=>x.checked)?.value || old.writeMode || "auto");
 const pv=document.getElementById(id+"_padVisible");
 d.padVisible=pv?pv.checked:(old.padVisible!==false);
 d.manualLineHeight=old.manualLineHeight||"1.35"; d.manualFontSize=old.manualFontSize||"16px"; d.manualAlign=old.manualAlign||"left"; d.signatureFontSize=old.signatureFontSize||"16px"; d.signatureLineHeight=old.signatureLineHeight||"1.75"; d.showPresident=old.showPresident!==false; d.showSignature=old.showSignature!==false; d.showCommittee=old.showCommittee!==false;
 return d;
}

function getManualEditor(){ return document.getElementById(current + "_manualText"); }
function selectionInsideEditor(ed){
 const sel=window.getSelection();
 if(!ed || !sel || !sel.rangeCount) return null;
 const r=sel.getRangeAt(0);
 if(!ed.contains(r.startContainer) || !ed.contains(r.endContainer)) return null;
 return {sel,range:r};
}
function blockOf(node,ed){
 if(node && node.nodeType===3) node=node.parentElement;
 let el=node;
 while(el && el!==ed){
   if(/^(DIV|P|LI|BLOCKQUOTE|H1|H2|H3|H4|H5|H6)$/.test(el.tagName)) return el;
   el=el.parentElement;
 }
 return ed;
}
function selectedBlocks(ed){
 const info=selectionInsideEditor(ed);
 if(!info) return [];
 const {range}=info;
 const blocks=[];
 const candidates=[...ed.querySelectorAll("div,p,li,blockquote,h1,h2,h3,h4,h5,h6")];
 candidates.forEach(el=>{
   try{
     if(range.intersectsNode(el) && ![...el.children].some(ch=>/^(DIV|P|LI|BLOCKQUOTE|H1|H2|H3|H4|H5|H6)$/.test(ch.tagName) && range.intersectsNode(ch))) blocks.push(el);
   }catch(e){}
 });
 if(!blocks.length){
   const a=blockOf(range.startContainer,ed), b=blockOf(range.endContainer,ed);
   if(a!==ed) blocks.push(a);
   if(b!==ed && b!==a) blocks.push(b);
 }
 return [...new Set(blocks)];
}
function rememberSelection(ed){
 const info=selectionInsideEditor(ed);
 if(!info) return;
 try{
   const r=info.range.cloneRange();
   // Ignore a collapsed caret when the user actually has text selected.
   // This prevents the toolbar itself from replacing the saved selection.
   if(!r.collapsed || !ed._savedRange || !ed._savedRange.collapsed){
     ed._savedRange=r;
   }
 }catch(e){}
}
function restoreSelection(ed){
 if(!ed || !ed._savedRange) return false;
 try{
   const r=ed._savedRange.cloneRange();
   if(!ed.contains(r.startContainer) || !ed.contains(r.endContainer)) return false;
   const sel=window.getSelection();
   sel.removeAllRanges();
   sel.addRange(r);
   ed.focus({preventScroll:true});
   return true;
 }catch(e){ return false; }
}
function formatManual(cmd,value){
 const ed=getManualEditor(); if(!ed) return;
 restoreSelection(ed);
 try{ document.execCommand("styleWithCSS",false,true); }catch(e){}
 document.execCommand(cmd,false,value||null);
 syncManualFromEditor();
 rememberSelection(ed);
}
function setManualFontSize(px){
 const ed=getManualEditor(); if(!ed) return;
 const restored=restoreSelection(ed);
 const sel=window.getSelection();
 const hasRange=restored && sel && sel.rangeCount && !sel.getRangeAt(0).collapsed && ed.contains(sel.getRangeAt(0).commonAncestorContainer);
 try{ document.execCommand("styleWithCSS",false,true); }catch(e){}
 if(hasRange){
   document.execCommand("fontSize",false,"7");
   ed.querySelectorAll('font[size="7"]').forEach(el=>{el.removeAttribute("size");el.style.fontSize=px;});
   const r=sel.getRangeAt(0);
   ed.querySelectorAll('[style*="font-size"]').forEach(el=>{try{if(r.intersectsNode(el)&&el!==ed)el.style.fontSize=px;}catch(e){}});
 }else{
   ed.style.fontSize=px;
 }
 const d=get(current); d.manualFontSize=px; localStorage.setItem(key(current),JSON.stringify(d));
 syncManualFromEditor(); rememberSelection(ed);
}
function applySelectedBlockStyle(style,value){
 const ed=getManualEditor(); if(!ed) return;
 restoreSelection(ed);
 const blocks=selectedBlocks(ed);
 if(blocks.length){ blocks.forEach(b=>b.style[style]=value); }
 else { ed.style[style]=value; }
 syncManualFromEditor(); rememberSelection(ed);
}
function setManualAlign(value){
 const ed=getManualEditor(); if(!ed) return;
 applySelectedBlockStyle("textAlign",value);
 const d=get(current); d.manualAlign=value; localStorage.setItem(key(current),JSON.stringify(d));
}

function signHtml(d){
 const parts=[];
 if(d.showPresident!==false) parts.push("সভাপতি / সম্পাদক");
 if(d.showSignature!==false) parts.push("স্বাক্ষর: ____________________");
 if(d.showCommittee!==false) parts.push(esc(cname()));
 const fs=d.signatureFontSize||"16px";
 const lh=d.signatureLineHeight||"1.75";
 return `<span style="font-size:${fs};line-height:${lh};display:inline-block">${parts.join("<br>")}</span>`;
}
function setManualLineSpace(value){
 const ed=getManualEditor(); if(!ed) return;

 // IMPORTANT: restore the exact text selection before reading blocks.
 // On Android Chrome, changing a toolbar <select> moves focus away from
 // contenteditable and the native selection can otherwise be lost.
 const restored=restoreSelection(ed);
 const blocks=restored ? selectedBlocks(ed) : [];

 if(blocks.length){
   // Apply only to the selected paragraph/line blocks.
   blocks.forEach(b=>{
     if(b && b!==ed) b.style.lineHeight=value;
   });
 }else if(restored){
   // A selection exists but it did not contain a block element.
   // Wrap the selected text in an inline-block span so ONLY the selected
   // part gets the requested line-height instead of changing the editor.
   const sel=window.getSelection();
   if(sel && sel.rangeCount && !sel.getRangeAt(0).collapsed){
     const range=sel.getRangeAt(0);
     if(ed.contains(range.commonAncestorContainer)){
       try{
         const span=document.createElement("span");
         span.style.lineHeight=value;
         span.style.display="inline-block";
         range.surroundContents(span);
       }catch(e){
         // If the range crosses elements, use the selected blocks instead.
         ed.style.lineHeight=ed.style.lineHeight;
       }
     }
   }
 }else{
   // No saved selection: intentionally change the whole editor.
   ed.style.lineHeight=value;
   ed.querySelectorAll("p,div,li,blockquote,h1,h2,h3,h4,h5,h6").forEach(b=>{
     if(b!==ed) b.style.lineHeight=value;
   });
 }

 const d=get(current);
 d.manualLineHeight=value;
 d.manualHtml=ed.innerHTML;
 d.manualText=ed.innerText;
 localStorage.setItem(key(current),JSON.stringify(d));
 syncManualFromEditor();
 rememberSelection(ed);

 const pv=document.getElementById("pvText");
 if(pv) pv.style.lineHeight=value;
}
function syncManualFromEditor(){
 const ed=getManualEditor(); if(!ed) return;
 const d=get(current); d.manualHtml=ed.innerHTML; d.manualText=ed.innerText;
 localStorage.setItem(key(current),JSON.stringify(d));
 rememberSelection(ed);
}
function prepareManualToolbar(){
 const ed=getManualEditor(); if(!ed) return;
 ["mouseup","keyup","selectstart","input","touchend"].forEach(ev=>{
   ed.addEventListener(ev,()=>requestAnimationFrame(()=>rememberSelection(ed)));
 });
 ed.addEventListener("blur",()=>{
   // Do not overwrite a real saved range with the toolbar's collapsed caret.
   setTimeout(()=>rememberSelection(ed),0);
 });
 if(!window._manualSelectionWatcher){
   window._manualSelectionWatcher=true;
   document.addEventListener("selectionchange",()=>{
     const e=getManualEditor();
     if(!e) return;
     const info=selectionInsideEditor(e);
     if(info && !info.range.collapsed) rememberSelection(e);
   });
 }
}

function getDisplayText(f,d){
 if(f && f.id==="manual") return d.manualText||"";

 return d.writeMode==="manual" ? (d.manualText||"") : f.make(d);
}

function highlightDataText(text,f,d){
 const raw=String(text||"");
 if(!raw) return "";
 let html=esc(raw);
 const values=[];
 (f.fields||[]).forEach(x=>{
   const v=String(d[x[0]]||"").trim();
   if(v && v.length>=2 && x[2]!=="select") values.push(v);
 });
 [...new Set(values)].sort((a,b)=>b.length-a.length).forEach(v=>{
   const ev=esc(v).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
   if(!ev) return;
   html=html.replace(new RegExp(ev,'g'),'<span class="data-highlight">$&</span>');
 });
 return html;
}

<script id="saved-application-manager">
(function(){
  const STORE_KEY = "puja_saved_applications_v2";

  function readSavedApplications(){
    try{
      const x = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
      if(!Array.isArray(x)) return [];
      let changed=false;
      const counts={};
      x.forEach(item=>{
        if(!item || typeof item!=="object") return;
        const generic=!item.title || item.title==="দরখাস্ত" || item.title==="নতুন দরখাস্ত";
        if(generic){
          const base=item.data?.__savedApplicationTitle || item.data?.__formTitle || "দরখাস্ত";
          const stamp=item.createdAt ? new Date(item.createdAt).toLocaleString("bn-BD",{dateStyle:"short",timeStyle:"short"}) : "";
          item.title=stamp ? `${base} — ${stamp}` : base;
          changed=true;
        }
        counts[item.title]=(counts[item.title]||0)+1;
      });
      // If older records still have duplicate names, make them distinguishable once.
      const seen={};
      x.forEach(item=>{
        if(!item || !item.title) return;
        seen[item.title]=(seen[item.title]||0)+1;
        if(counts[item.title]>1){
          const stamp=item.createdAt ? new Date(item.createdAt).toLocaleString("bn-BD",{dateStyle:"short",timeStyle:"short"}) : String(item.id||"");
          let next=`${item.title} — ${stamp}`;
          if(next===item.title || x.filter(y=>y && y!==item && y.title===next).length){ next+=` — ${String(item.id||"").slice(-5)}`; }
          if(item.title!==next){ item.title=next; if(item.data) item.data.__savedApplicationTitle=item.title; changed=true; }
        }
      });
      if(changed) localStorage.setItem(STORE_KEY,JSON.stringify(x));
      return x;
    }catch(e){ return []; }
  }
  function writeSavedApplications(list){
    localStorage.setItem(STORE_KEY, JSON.stringify(list));
  }
  function cloneData(d){
    try { return JSON.parse(JSON.stringify(d)); } catch(e){ return {...d}; }
  }
  function makeId(){
    return "app_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
  }

  // Public API used by the existing page.
  window.savedApplications = {
    all: readSavedApplications,
    get: function(id){ return readSavedApplications().find(x=>x.id===id) || null; },

    save: function(data, id, title){
      const list = readSavedApplications();
      const now = new Date().toISOString();
      let item = id ? list.find(x=>x.id===id) : null;
      const cleanTitle=String(title || data?.__savedApplicationTitle || data?.subject || data?.title || data?.applicationTitle || "দরখাস্ত").trim() || "দরখাস্ত";

      if(item){
        item.data = cloneData(data);
        item.title = item.title || cleanTitle;
        item.data.__savedApplicationTitle=item.title;
        item.updatedAt = now;
      }else{
        item = {
          id: makeId(),
          title: cleanTitle,
          data: cloneData(data),
          createdAt: now,
          updatedAt: now
        };
        item.data.__savedApplicationTitle=item.title;
        list.unshift(item);
      }
      writeSavedApplications(list);
      return item;
    },

    remove: function(id){
      const list = readSavedApplications().filter(x=>x.id!==id);
      writeSavedApplications(list);
      return list;
    },

    rename: function(id,title){
      const list = readSavedApplications();
      const item = list.find(x=>x.id===id);
      if(item){ item.title = title || "দরখাস্ত"; if(item.data) item.data.__savedApplicationTitle=item.title; item.updatedAt = new Date().toISOString(); }
      writeSavedApplications(list);
      return item || null;
    }
  };

  // A safe, non-destructive hook: keep the page's current data separate from
  // saved records. Existing save functions can call this helper.
  window.getSavedApplications = savedApplications.all;
  window.saveApplicationCopy = savedApplications.save;
  window.deleteSavedApplication = savedApplications.remove;

  // Load a saved application back into the existing editor without changing the design.
  window.loadSavedApplicationIntoEditor = function(item){
    try{
      const data = cloneData(item?.data || {});
      const formId = data.__formId || "manual";
      delete data.__formId; delete data.__formTitle;
      if(item?.id) data.__savedApplicationId = item.id;
      if(item?.title) data.__savedApplicationTitle = item.title;
      localStorage.setItem(key(formId), JSON.stringify(data));
      current = formId;
      buildTabs();
      buildForm();
    }catch(e){ console.error(e); alert("সংরক্ষিত দরখাস্ত খোলা যায়নি।"); }
  };

  // Expose a small manager panel only if the page does not already have one.
  // It is intentionally hidden until the user clicks the "Saved Applications"
  // button created below.
  function addManagerButton(){
    const b=document.getElementById("savedAppsManagerBtn");
    if(!b) return;
    b.onclick=showSavedApps;
  }

  function showSavedApps(){
    let old=document.getElementById("savedAppsOverlay");
    if(old) old.remove();

    const overlay=document.createElement("div");
    overlay.id="savedAppsOverlay";
    overlay.className="no-print";

    if(!list.length){
      box.innerHTML+='<div style="padding:28px;text-align:center;color:#666">এখনও কোনো দরখাস্ত সংরক্ষণ করা হয়নি।</div>';
    }else{
      list.forEach(item=>{
        const row=document.createElement("div");
        row.style.cssText="border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:9px 0;display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap";

        title.innerHTML='<div class="saved-app-title-full" style="font-weight:800;white-space:normal;overflow:visible;text-overflow:clip;word-break:break-word;overflow-wrap:anywhere;line-height:1.35"></div><small style="color:#777;display:block;line-height:1.3;margin-top:3px"></small>';
        title.firstChild.textContent=item.title || "দরখাস্ত";
        title.lastChild.textContent="শেষ পরিবর্তন: "+new Date(item.updatedAt||item.createdAt).toLocaleString("bn-BD");
        const edit=document.createElement("button");
        edit.textContent="✏️ Edit";
        edit.style.cssText="border:0;background:#2563eb;color:#fff;border-radius:9px;padding:8px 12px;font-weight:700;cursor:pointer";
        edit.onclick=function(){
          if(typeof window.loadSavedApplicationIntoEditor==="function"){
            window.loadSavedApplicationIntoEditor(item);
            overlay.remove();
          }else{
            alert("এই পেজের বর্তমান editor-এ saved application loader এখনো সংযুক্ত হয়নি।");
          }
        };
        const rename=document.createElement("button");
        rename.textContent="✏️ নাম";
        rename.style.cssText="border:0;background:#f59e0b;color:#fff;border-radius:9px;padding:8px 12px;font-weight:700;cursor:pointer";
        rename.onclick=function(){
          const next=prompt("দরখাস্তের নাম পরিবর্তন করুন:",item.title||"দরখাস্ত");
          if(next!==null && String(next).trim()){
            const updated=savedApplications.rename(item.id,String(next).trim());
            if(updated?.data) updated.data.__savedApplicationTitle=updated.title;
            if(window.dpmsFirebase?.user && window.firestoreSavePujaDorkhasto){
              const formsData={}; forms.forEach(f=>{formsData[f.id]=get(f.id)});
              window.firestoreSavePujaDorkhasto(formsData,savedApplications.all()).catch(e=>console.warn("Saved application cloud rename failed:",e));
            }
            showSavedApps();
          }
        };
        const del=document.createElement("button");
        del.textContent="🗑️ Delete";
        del.style.cssText="border:0;background:#dc2626;color:#fff;border-radius:9px;padding:8px 12px;font-weight:700;cursor:pointer";
        del.onclick=function(){
          if(confirm("এই দরখাস্তটি স্থায়ীভাবে মুছে ফেলবেন?")){
            const remaining=savedApplications.remove(item.id);
            if(window.dpmsFirebase?.user && window.firestoreSavePujaDorkhasto){
              const formsData={}; forms.forEach(f=>{formsData[f.id]=get(f.id)});
              window.firestoreSavePujaDorkhasto(formsData, remaining).catch(e=>console.warn("Saved application cloud delete failed:",e));
            }
            showSavedApps();
          }
        };
        row.append(title,edit,rename,del);
        box.appendChild(row);
      });
    }
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    document.getElementById("closeSavedApps").onclick=()=>overlay.remove();
  }

  // Make the manager available after the page is ready.
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",addManagerButton);
  else addManagerButton();
})();
</script>


<script id="new-application-helper">
window.startNewApplicationWithoutDeletingSaved = function(){
  try{
    // Preserve every saved record. Only clear transient/current editing state.
    const keep = {};
    Object.keys(localStorage).forEach(k=>{
      if(k==="puja_saved_applications_v2") keep[k]=localStorage.getItem(k);
    });
    location.reload();
  }catch(e){ location.reload(); }
};
</script>
