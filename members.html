<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>সদস্য ব্যবস্থাপনা</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- ExcelJS and FileSaver for Custom Styled Excel Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <style>
    th, td { text-align: center; vertical-align: middle; white-space: nowrap; }
    @media print {
      body { background: white !important; }
      body > *:not(#idCardModal) { display: none !important; }
      #idCardModal { position: fixed !important; inset: 0 !important; background: white !important; display: flex !important; align-items: center !important; justify-content: center !important; }
      .no-print { display: none !important; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    }
  </style>
</head>
<body class="bg-amber-50/40 p-3 font-sans pb-20">
  <div class="max-w-4xl mx-auto">
    
    <!-- Member Section -->
    <div id="section-member" class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
      <div class="flex items-center justify-between mb-4 border-b pb-3">
        <div class="flex items-center gap-2">
          <!-- হোম বাটন -->
          <button onclick="window.location.href='dashboard.html'" class="bg-gray-100 border px-3 py-1 rounded-lg text-sm font-bold hover:bg-gray-200">
            ⬅️ হোম
          </button>
          <h2 class="text-lg font-bold text-gray-800">সদস্য ব্যবস্থাপনা</h2>
        </div>
        <span class="text-sm font-bold text-gray-600 bg-gray-100 px-3 py-1 rounded-full" id="totalMembersCount">মোট সদস্য: ০</span>
      </div>

      <div id="adminMemberControls" class="flex flex-wrap gap-2 mb-4 hidden">
        <button onclick="openAddModal()" class="bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-1 hover:bg-gray-800 shadow-sm">➕ যোগ করুন</button>
        <button onclick="exportToExcel()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-1 hover:bg-emerald-700 shadow-sm">📥 এক্সেল এক্সপোর্ট</button>
        <button onclick="deleteSelectedMembers()" class="bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-1 hover:bg-red-700 shadow-sm">🗑️ সিলেক্টেড ডিলিট</button>
      </div>

      <div class="flex flex-col md:flex-row gap-2 mb-4">
        <!-- সার্চ বক্স -->
        <input type="text" id="searchInput" onkeyup="filterMembers()" placeholder="নাম, মোবাইল, পদ দিয়ে খুঁজুন..." class="flex-1 p-2.5 border rounded-lg text-sm focus:outline-none focus:border-orange-500" />
        <!-- গ্রামের ড্রপডাউন -->
        <select id="villageFilter" onchange="filterMembers()" class="w-full md:w-48 p-2.5 border rounded-lg text-sm focus:outline-none focus:border-orange-500 bg-white">
          <option value="">সব গ্রাম (All)</option>
        </select>
      </div>

      <div class="overflow-x-auto border rounded-lg">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-gray-100 text-gray-700 border-b">
              <th class="p-2.5 border-r text-center align-middle w-10 admin-only-col hidden">
                <input type="checkbox" id="selectAll" onclick="toggleSelectAll()" class="cursor-pointer w-4 h-4" />
              </th>
              <th class="p-2.5 border-r text-center align-middle">ID</th>
              <th class="p-2.5 border-r text-center align-middle">ছবি</th>
              <th class="p-2.5 border-r text-center align-middle">নাম</th>
              <th class="p-2.5 border-r text-center align-middle">গ্রাম</th>
              <th class="p-2.5 border-r text-center align-middle">পদ</th>
              <th class="p-2.5 border-r text-center align-middle">মোবাইল</th>
              <th class="p-2.5 border-r text-center align-middle">স্বাক্ষর</th>
              <th class="p-2.5 text-center align-middle">অ্যাকশন</th>
            </tr>
          </thead>
          <tbody id="memberTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Add Member Modal -->
  <div id="addMemberModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white w-full max-w-md p-6 rounded-xl shadow-lg max-h-[90vh] overflow-y-auto">
      <h3 id="modalTitle" class="text-lg font-bold text-orange-600 mb-4">নতুন সদস্য যুক্ত করুন</h3>
      <input type="hidden" id="editMemberDocId" />
      
      <label class="block text-xs font-semibold text-gray-600 mb-1">সদস্যের নাম *</label>
      <input type="text" id="newMemberName" class="w-full p-2.5 border rounded-lg mb-3 text-sm" />
      
      <label class="block text-xs font-semibold text-gray-600 mb-1">গ্রাম *</label>
      <input type="text" id="newMemberVillage" class="w-full p-2.5 border rounded-lg mb-3 text-sm" />
      
      <label class="block text-xs font-semibold text-gray-600 mb-1">সদস্য পদ</label>
      <select id="newMemberRole" class="w-full p-2.5 border rounded-lg mb-3 text-sm bg-white">
        <option value="সাধারণ সদস্য">সাধারণ সদস্য</option>
        <option value="সভাপতি">সভাপতি</option>
        <option value="সম্পাদক">সম্পাদক</option>
        <option value="কোষাধ্যক্ষ">কোষাধ্যক্ষ</option>
      </select>
      
      <label class="block text-xs font-semibold text-gray-600 mb-1">মোবাইল নম্বর</label>
      <input type="tel" id="newMemberMobile" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="w-full p-2.5 border rounded-lg mb-3 text-sm" />
      
      <label class="block text-xs font-semibold text-gray-600 mb-1">সদস্যের ছবি</label>
      <input type="file" id="photoInput" onchange="processImage(this, 'photoPreview', 300, 300)" class="w-full p-2 border rounded-lg mb-2 text-xs bg-gray-50" />
      <img id="photoPreview" class="w-16 h-16 object-cover rounded-full border border-gray-300 hidden mx-auto mb-3" />
      
      <label class="block text-xs font-semibold text-gray-600 mb-1">স্বাক্ষর</label>
      <input type="file" id="sigInput" onchange="processImage(this, 'sigPreview', 300, 100)" class="w-full p-2 border rounded-lg mb-2 text-xs bg-gray-50" />
      <img id="sigPreview" class="h-10 object-contain border border-gray-300 rounded hidden px-2 py-1 mx-auto mb-4" />
      
      <div class="flex justify-end gap-2">
        <button onclick="closeAddModal()" class="bg-gray-300 px-4 py-2 rounded-lg text-sm font-semibold">বাতিল</button>
        <button onclick="saveOrUpdateMember()" class="bg-orange-600 text-white px-4 py-2 rounded-lg text-sm font-bold">সেভ করুন</button>
      </div>
    </div>
  </div>

  <!-- ID Card Modal -->
  <div id="idCardModal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-50">
    <div id="idCardBox" class="bg-white w-[340px] h-[245px] rounded-xl shadow-2xl overflow-hidden border-2 flex flex-col relative transition-all duration-300">
      <div id="idCardHeader" class="px-2 py-1.5 flex flex-col justify-center items-center relative">
        <h4 class="font-bold text-[13px] leading-tight text-center">নেকড়ামারি সর্বজনীন দুর্গোৎসব কমিটি</h4>
        <p class="text-[9px] font-medium text-center mt-0.5 opacity-90">এটি কমিটির অফিসিয়াল পরিচয়পত্র</p>
        <span id="vipBadge" class="hidden absolute right-2 top-1.5 bg-yellow-400 text-black text-[9px] px-2 py-0.5 rounded font-extrabold shadow-sm border border-yellow-500 tracking-wider">VIP</span>
      </div>
      <div id="idCardBody" class="px-3 flex items-center gap-3 flex-1">
        <img id="idCardPhoto" src="" class="w-[70px] h-[70px] object-cover rounded-full border-2" />
        <div class="text-left flex-1 pl-1">
          <h3 id="idCardName" class="text-sm font-bold text-gray-800"></h3>
          <p id="idCardRole" class="text-[10px] font-semibold inline-block px-2 py-0.5 rounded-full mt-0.5"></p>
          <div class="mt-1 text-[10px] text-gray-700 space-y-0.5">
            <p><strong>আইডি:</strong> <span id="idCardAutoId"></span></p>
            <p><strong>গ্রাম:</strong> <span id="idCardVillage"></span></p>
            <p><strong>মোবাইল:</strong> <span id="idCardMobile"></span></p>
          </div>
        </div>
      </div>
      <div class="px-5 pb-2 flex justify-between items-end h-[95px] w-full">
        <div id="memberSigContainer" class="text-center w-1/3 flex flex-col items-center justify-end">
          <img id="idCardMemberSig" src="" class="h-6 object-contain mx-auto mb-1" onerror="this.style.display='none'">
          <div class="border-t border-gray-400 text-[9px] text-gray-700 pt-0.5 font-bold w-full">সদস্যের স্বাক্ষর</div>
        </div>
        <div id="presSigContainer" class="text-center w-[45%] flex flex-col items-center justify-end ml-auto">
          <canvas id="idCardQrCode" class="w-14 h-14 mb-1.5 shadow-sm mx-auto bg-white rounded-sm"></canvas>
          <img id="idCardPresSig" src="" class="h-6 object-contain mx-auto mb-0.5" onerror="this.style.display='none'">
          <div id="presSigLabel" class="border-t border-gray-400 text-[9px] text-gray-700 pt-0.5 font-bold w-full">সভাপতির স্বাক্ষর</div>
        </div>
      </div>
    </div>
    <div class="absolute bottom-5 flex gap-2 no-print">
      <button onclick="window.print()" class="bg-blue-600 text-white px-5 py-2 rounded-lg text-sm font-bold shadow-lg">🖨️ প্রিন্ট</button>
      <button onclick="closeIdCardModal()" class="bg-gray-600 text-white px-5 py-2 rounded-lg text-sm font-bold shadow-lg">বন্ধ</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyByG-eBGnsUMX1zchs8sJV9MNZL-Sx0Nqs",
      authDomain: "durgapuja-2026.firebaseapp.com",
      projectId: "durgapuja-2026",
      storageBucket: "durgapuja-2026.firebasestorage.app",
      messagingSenderId: "625976130920",
      appId: "1:625976130920:web:60190b21f1c7563cdd2add",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let allMembersData = [];
    window.filteredMembersData = []; // নতুন ভেরিয়েবল যা ফিল্টার করা ডেটা রাখবে
    let processedPhotoBase64 = "";
    let processedSigBase64 = "";

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.currentUserRole = user.email === "bappasarkar1173@gmail.com" ? "admin" : "user";
        if(window.currentUserRole === "admin") {
          document.getElementById("adminMemberControls").classList.remove("hidden");
          document.querySelectorAll(".admin-only-col").forEach(col => col.classList.remove("hidden"));
        }
        loadMembers();
      } else {
        window.location.replace("index.html");
      }
    });

    function loadMembers() {
      onSnapshot(collection(db, "members"), (snapshot) => {
        allMembersData = [];
        snapshot.forEach((docSnap) => { allMembersData.push({ id: docSnap.id, ...docSnap.data() }); });
        
        allMembersData.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        allMembersData.forEach((m, idx) => (m.autoId = "M" + String(idx + 1).padStart(3, "0")));
        
        // গ্রামের ড্রপডাউন আপডেট করা
        populateVillageDropdown(allMembersData);
        
        // ডেটা লোড হওয়ার পর ফিল্টার অ্যাপ্লাই করা
        window.filterMembers();
      });
    }

    function populateVillageDropdown(data) {
      const villageFilter = document.getElementById("villageFilter");
      const currentSelection = villageFilter.value; // আগের সিলেকশন ধরে রাখতে
      
      // ইউনিক গ্রামের নাম বের করা
      const uniqueVillages = [...new Set(data.map(m => m.village))].filter(v => v).sort();
      
      let optionsHtml = '<option value="">সব গ্রাম (All)</option>';
      uniqueVillages.forEach(village => {
        optionsHtml += `<option value="${village}">${village}</option>`;
      });
      
      villageFilter.innerHTML = optionsHtml;
      
      // যদি আগে কোনো গ্রাম সিলেক্ট করা থাকে এবং সেটা লিস্টে থাকে
      if(uniqueVillages.includes(currentSelection)) {
        villageFilter.value = currentSelection;
      }
    }

    window.renderTable = function(data) {
      const tbody = document.getElementById("memberTableBody");
      tbody.innerHTML = "";
      document.getElementById("totalMembersCount").innerText = `মোট সদস্য: ${data.length}`;
      data.forEach((member) => {
        const tr = document.createElement("tr");
        tr.className = "border-b hover:bg-gray-50";
        let actionButtons = `<button onclick="openIdCard('${member.id}')" class="bg-indigo-100 text-indigo-700 px-2 py-1 rounded text-xs">আইডি</button>`;
        if (window.currentUserRole === "admin") {
          actionButtons += `<button onclick="openEditModal('${member.id}')" class="bg-amber-100 text-amber-700 px-2 py-1 rounded text-xs ml-1">এডিট</button>
                            <button onclick="deleteMember('${member.id}')" class="bg-red-100 text-red-600 px-2 py-1 rounded text-xs ml-1">ডিলিট</button>`;
        }
        tr.innerHTML = `
          ${window.currentUserRole === "admin" ? `<td class="p-2.5 border-r text-center admin-only-col"><input type="checkbox" class="member-checkbox" value="${member.id}"></td>` : ""}
          <td class="p-2.5 border-r font-bold text-orange-600 text-center">${member.autoId}</td>
          <td class="p-2.5 border-r text-center"><img src="${member.photo || ''}" class="w-9 h-9 object-cover rounded-full mx-auto border" onerror="this.style.display='none'"></td>
          <td class="p-2.5 border-r font-medium text-gray-800 text-center">${member.name}</td>
          <td class="p-2.5 border-r text-gray-700 text-center">${member.village}</td>
          <td class="p-2.5 border-r text-gray-700 text-center">${member.role}</td>
          <td class="p-2.5 border-r text-gray-600 text-center">${member.mobile}</td>
          <td class="p-2.5 border-r text-center"><img src="${member.signature || ''}" class="h-6 object-contain mx-auto border px-1" onerror="this.style.display='none'"></td>
          <td class="p-2.5 text-center">${actionButtons}</td>
        `;
        tbody.appendChild(tr);
      });
    };

    window.processImage = function(input, previewId, maxWidth, maxHeight) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          let width = img.width;
          let height = img.height;
          if (width > height) {
            if (width > maxWidth) { height = Math.round(height * (maxWidth / width)); width = maxWidth; }
          } else {
            if (height > maxHeight) { width = Math.round(width * (maxHeight / height)); height = maxHeight; }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.7);
          
          document.getElementById(previewId).src = dataUrl;
          document.getElementById(previewId).classList.remove("hidden");
          
          if (previewId === "photoPreview") processedPhotoBase64 = dataUrl;
          else if (previewId === "sigPreview") processedSigBase64 = dataUrl;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    };

    window.saveOrUpdateMember = async function() {
      const name = document.getElementById("newMemberName").value.trim();
      const village = document.getElementById("newMemberVillage").value.trim();
      const role = document.getElementById("newMemberRole").value;
      const mobile = document.getElementById("newMemberMobile").value.trim();
      const docId = document.getElementById("editMemberDocId").value;

      if (!name || !village) {
        alert("নাম এবং গ্রাম অবশ্যই দিতে হবে!");
        return;
      }

      const memberData = { name, village, role, mobile: mobile || "-", updatedAt: Date.now() };

      if (processedPhotoBase64) memberData.photo = processedPhotoBase64;
      if (processedSigBase64) memberData.signature = processedSigBase64;

      try {
        if (docId) {
          await updateDoc(doc(db, "members", docId), memberData);
          alert("সদস্যের তথ্য সফলভাবে আপডেট হয়েছে!");
        } else {
          memberData.createdAt = Date.now();
          await addDoc(collection(db, "members"), memberData);
          alert("নতুন সদস্য সফলভাবে যুক্ত হয়েছে!");
        }
        closeAddModal();
      } catch (error) {
        console.error("Error saving member: ", error);
        alert("ডাটা সেভ করতে সমস্যা হয়েছে!");
      }
    };

    window.openEditModal = function(id) {
      const member = allMembersData.find(m => m.id === id);
      if (!member) return;
      
      document.getElementById("modalTitle").innerText = "সদস্যের তথ্য আপডেট করুন";
      document.getElementById("editMemberDocId").value = member.id;
      document.getElementById("newMemberName").value = member.name;
      document.getElementById("newMemberVillage").value = member.village;
      document.getElementById("newMemberRole").value = member.role;
      document.getElementById("newMemberMobile").value = member.mobile !== "-" ? member.mobile : "";
      
      processedPhotoBase64 = member.photo || "";
      processedSigBase64 = member.signature || "";
      
      const photoPreview = document.getElementById("photoPreview");
      if(member.photo) { photoPreview.src = member.photo; photoPreview.classList.remove("hidden"); }
      else { photoPreview.classList.add("hidden"); }
      
      const sigPreview = document.getElementById("sigPreview");
      if(member.signature) { sigPreview.src = member.signature; sigPreview.classList.remove("hidden"); }
      else { sigPreview.classList.add("hidden"); }
      
      openAddModal();
    };

    window.deleteMember = async function(id) {
      if(confirm("আপনি কি নিশ্চিত যে এই সদস্যকে মুছে ফেলতে চান?")) {
        try {
          await deleteDoc(doc(db, "members", id));
          alert("সদস্যকে মুছে ফেলা হয়েছে।");
        } catch(error) {
          alert("মুছে ফেলতে সমস্যা হয়েছে!");
        }
      }
    };

    window.deleteSelectedMembers = async function() {
      const checkboxes = document.querySelectorAll(".member-checkbox:checked");
      if(checkboxes.length === 0) return alert("কোনো সদস্য নির্বাচন করা হয়নি!");
      if(confirm(`আপনি কি নিশ্চিত যে ${checkboxes.length} জন সদস্যকে মুছে ফেলতে চান?`)) {
        try {
          for(let cb of checkboxes) await deleteDoc(doc(db, "members", cb.value));
          document.getElementById("selectAll").checked = false;
          alert("নির্বাচিত সদস্যদের মুছে ফেলা হয়েছে।");
        } catch (error) {
          alert("ডিলিট করতে সমস্যা হয়েছে!");
        }
      }
    };

    // 필্টার ফাংশন আপডেট করা হলো - সার্চ টেক্সট এবং গ্রাম দুটোই চেক করবে
    window.filterMembers = function() {
      const searchText = document.getElementById("searchInput").value.toLowerCase();
      const selectedVillage = document.getElementById("villageFilter").value;

      window.filteredMembersData = allMembersData.filter(m => {
        const matchSearch = m.name.toLowerCase().includes(searchText) || 
                            m.mobile.includes(searchText) || 
                            m.role.toLowerCase().includes(searchText) ||
                            m.autoId.toLowerCase().includes(searchText);
                            
        const matchVillage = selectedVillage === "" || m.village === selectedVillage;
        
        return matchSearch && matchVillage;
      });
      
      renderTable(window.filteredMembersData);
    };

    window.toggleSelectAll = function() {
      const isChecked = document.getElementById("selectAll").checked;
      document.querySelectorAll(".member-checkbox").forEach(cb => cb.checked = isChecked);
    };

    // =================================================================
    // NEW ADVANCED EXCEL EXPORT (Exports Filtered Data ONLY)
    // =================================================================
    window.exportToExcel = async function() {
      const dataToExport = window.filteredMembersData || allMembersData;
      const selectedVillage = document.getElementById("villageFilter").value;

      if(dataToExport.length === 0) return alert("এক্সপোর্ট করার মতো কোনো ডেটা নেই!");
      
      const workbook = new ExcelJS.Workbook();
      const worksheet = workbook.addWorksheet("সদস্য তালিকা");
      
      worksheet.columns = [
        { width: 15 }, // A: সদস্য ID
        { width: 35 }, // B: নাম
        { width: 20 }, // C: মোবাইল
        { width: 25 }, // D: গ্রাম
        { width: 35 }  // E: স্বাক্ষর (Image + Text)
      ];

      // Row 1: মেইন টাইটেল
      worksheet.mergeCells('A1:E1');
      const titleCell = worksheet.getCell('A1');
      titleCell.value = 'নেকড়ামারি সর্বজনীন দুর্গোৎসব কমিটি';
      titleCell.font = { name: 'Kalpurush', size: 18, bold: true, color: { argb: 'FF000000' } };
      titleCell.alignment = { horizontal: 'center', vertical: 'middle' };
      titleCell.border = {
        top: { style: 'medium' }, bottom: { style: 'thin' },
        left: { style: 'medium' }, right: { style: 'medium' }
      };
      worksheet.getRow(1).height = 35;

      // Row 2: সাব টাইটেল (গ্রামের নাম সহ, যদি সিলেক্ট করা থাকে)
      worksheet.mergeCells('A2:E2');
      const subTitleCell = worksheet.getCell('A2');
      subTitleCell.value = selectedVillage ? `সদস্য তালিকা - ${selectedVillage}` : 'সদস্য তালিকা (সকল গ্রাম)';
      subTitleCell.font = { name: 'Kalpurush', size: 14, bold: true, color: { argb: 'FF000000' } };
      subTitleCell.alignment = { horizontal: 'center', vertical: 'middle' };
      subTitleCell.border = {
        bottom: { style: 'medium' }, left: { style: 'medium' }, right: { style: 'medium' }
      };
      worksheet.getRow(2).height = 25;

      // Row 3: কমলা হেডার
      const headers = ['সদস্য ID', 'নাম', 'মোবাইল', 'গ্রাম', 'স্বাক্ষর'];
      const headerRow = worksheet.getRow(3);
      headerRow.values = headers;
      headerRow.height = 30;

      headerRow.eachCell((cell) => {
        cell.font = { name: 'Kalpurush', size: 12, bold: true, color: { argb: 'FFFFFFFF' } };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF26522' } };
        cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
        cell.border = {
          top: { style: 'thin' }, left: { style: 'thin' },
          bottom: { style: 'thin' }, right: { style: 'thin' }
        };
      });

      // Rows Data Generation (ফিল্টার করা ডেটা ব্যবহার করা হচ্ছে)
      let currentRow = 4;
      dataToExport.forEach((m) => {
        const row = worksheet.getRow(currentRow);
        
        row.values = [
          m.autoId,
          m.name,
          m.mobile !== "-" ? m.mobile : "",
          m.village,
          m.signature ? "" : "নেই"
        ];
        
        row.height = 65; 
        
        row.eachCell((cell) => {
          cell.font = { size: 11, color: { argb: 'FF000000' } };
          cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
          cell.border = {
            top: { style: 'thin' }, left: { style: 'thin' },
            bottom: { style: 'thin' }, right: { style: 'thin' }
          };
        });

        // সিগনেচার ইমেজ এক্সেল সেলে ইম্পোর্ট করা
        if (m.signature) {
          try {
            const parts = m.signature.split(',');
            const base64Data = parts[1];
            const mime = parts[0].match(/:(.*?);/)[1];
            let ext = 'png';
            if(mime.includes('jpeg') || mime.includes('jpg')) ext = 'jpeg';

            const imageId = workbook.addImage({
              base64: base64Data,
              extension: ext,
            });

            worksheet.addImage(imageId, {
              tl: { col: 4.1, row: currentRow - 0.9 },
              ext: { width: 170, height: 70 },
              editAs: 'oneCell'
            });
          } catch(e) {
            console.error("Error adding signature image:", e);
          }
        }
        
        currentRow++;
      });

      // সবার শেষে Total Members রো
      worksheet.mergeCells(`A${currentRow}:E${currentRow}`);
      const totalCell = worksheet.getCell(`A${currentRow}`);
      totalCell.value = `মোট সদস্য: ${dataToExport.length} জন`;
      totalCell.font = { size: 14, bold: true, color: { argb: 'FF000000' } };
      totalCell.alignment = { horizontal: 'center', vertical: 'middle' };
      totalCell.border = {
        top: { style: 'medium' }, left: { style: 'thin' },
        bottom: { style: 'medium' }, right: { style: 'thin' }
      };
      worksheet.getRow(currentRow).height = 30;

      // Excel ফাইল ডাউনলোড (গ্রামের নাম অনুযায়ী ফাইলের নাম)
      const fileName = selectedVillage ? `Members_${selectedVillage}.xlsx` : "Members_All_Villages.xlsx";
      const buffer = await workbook.xlsx.writeBuffer();
      saveAs(new Blob([buffer]), fileName);
    };

    // =================================================================
    // Modal Helpers
    // =================================================================
    window.openAddModal = function() { document.getElementById("addMemberModal").classList.remove("hidden"); };
    window.closeAddModal = function() {
      document.getElementById("addMemberModal").classList.add("hidden");
      document.getElementById("editMemberDocId").value = "";
      document.getElementById("newMemberName").value = "";
      document.getElementById("newMemberVillage").value = "";
      document.getElementById("newMemberRole").value = "সাধারণ সদস্য";
      document.getElementById("newMemberMobile").value = "";
      document.getElementById("photoInput").value = "";
      document.getElementById("sigInput").value = "";
      document.getElementById("photoPreview").classList.add("hidden");
      document.getElementById("sigPreview").classList.add("hidden");
      processedPhotoBase64 = "";
      processedSigBase64 = "";
      document.getElementById("modalTitle").innerText = "নতুন সদস্য যুক্ত করুন";
    };

    window.openIdCard = function(id) {
      const member = allMembersData.find(m => m.id === id);
      if (!member) return;

      const president = allMembersData.find(m => m.role === "সভাপতি");
      const presSignature = president ? president.signature : "";

      document.getElementById("idCardName").innerText = member.name;
      document.getElementById("idCardRole").innerText = member.role;
      document.getElementById("idCardAutoId").innerText = member.autoId;
      document.getElementById("idCardVillage").innerText = member.village;
      document.getElementById("idCardMobile").innerText = member.mobile;
      document.getElementById("idCardPhoto").src = member.photo || "https://via.placeholder.com/150";

      const qrData = `ID: ${member.autoId}\nনাম: ${member.name}\nগ্রাম: ${member.village}\nপদ: ${member.role}\nমোবাইল: ${member.mobile}`;
      new QRious({
        element: document.getElementById('idCardQrCode'),
        value: qrData,
        size: 100, 
        level: 'M'
      });

      const cardBox = document.getElementById("idCardBox");
      const cardHeader = document.getElementById("idCardHeader");
      const cardBody = document.getElementById("idCardBody");
      const photoImg = document.getElementById("idCardPhoto");
      const roleBadge = document.getElementById("idCardRole");
      const vipBadge = document.getElementById("vipBadge");
      
      const memberSigContainer = document.getElementById("memberSigContainer");
      const presSigContainer = document.getElementById("presSigContainer");
      const memberSigImg = document.getElementById("idCardMemberSig");
      const presSigImg = document.getElementById("idCardPresSig");
      const presSigLabel = document.getElementById("presSigLabel");

      memberSigImg.style.display = 'block';
      presSigImg.style.display = 'block';

      if (member.role === "সভাপতি") {
        vipBadge.classList.remove("hidden");
        cardBox.className = "bg-white w-[340px] h-[245px] rounded-xl shadow-2xl overflow-hidden border-[3px] border-yellow-500 flex flex-col relative transition-all duration-300";
        cardHeader.className = "bg-gradient-to-r from-gray-900 via-black to-gray-900 text-yellow-500 px-2 py-1.5 flex flex-col justify-center items-center relative border-b border-yellow-600";
        cardBody.className = "px-3 flex items-center gap-3 flex-1 bg-gradient-to-br from-yellow-50 to-amber-100";
        photoImg.className = "w-[75px] h-[75px] object-cover rounded-full border-4 border-yellow-500 shadow-md";
        roleBadge.className = "text-[11px] font-extrabold text-gray-900 bg-gradient-to-r from-yellow-300 to-yellow-500 shadow border border-yellow-400 inline-block px-3 py-0.5 rounded-full mt-0.5";
        
        memberSigContainer.classList.add("hidden"); 
        presSigContainer.classList.remove("hidden");
        presSigContainer.className = "text-center w-[45%] flex flex-col items-center justify-end ml-auto"; 
        
        presSigImg.src = member.signature || "";
        presSigLabel.innerText = "নিজস্ব স্বাক্ষর"; 
      } else {
        vipBadge.classList.add("hidden");
        cardBox.className = "bg-white w-[340px] h-[245px] rounded-xl shadow-2xl overflow-hidden border-2 border-orange-500 flex flex-col relative transition-all duration-300";
        cardHeader.className = "bg-gradient-to-r from-orange-600 to-red-600 text-white px-2 py-1.5 flex flex-col justify-center items-center relative";
        cardBody.className = "px-3 flex items-center gap-3 flex-1 bg-amber-50/30";
        photoImg.className = "w-[70px] h-[70px] object-cover rounded-full border-2 border-orange-500";
        roleBadge.className = "text-[10px] font-semibold text-white bg-orange-500 inline-block px-2 py-0.5 rounded-full mt-0.5 shadow-sm";
        
        memberSigContainer.classList.remove("hidden");
        presSigContainer.classList.remove("hidden");
        presSigContainer.className = "text-center w-[45%] flex flex-col items-center justify-end ml-auto"; 
        
        memberSigImg.src = member.signature || ""; 
        presSigImg.src = presSignature || ""; 
        presSigLabel.innerText = "সভাপতির স্বাক্ষর";
      }
      document.getElementById("idCardModal").classList.remove("hidden");
    };

    window.closeIdCardModal = function() {
      document.getElementById("idCardModal").classList.add("hidden");
    };
  </script>
</body>
</html>
