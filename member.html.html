<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>সদস্য ব্যবস্থাপনা</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    th, td { text-align: center; vertical-align: middle; white-space: nowrap; }
    @media print {
      body { background: white !important; }
      body > *:not(#idCardModal) { display: none !important; }
      #idCardModal { position: fixed !important; inset: 0 !important; background: white !important; display: flex !important; align-items: center !important; justify-content: center !important; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-amber-50/40 p-3 font-sans pb-20">
  <div class="max-w-4xl mx-auto">
    
    <!-- Member Section (Always Visible) -->
    <div id="section-member" class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
      <div class="flex items-center justify-between mb-4 border-b pb-3">
        <div class="flex items-center gap-2">
          <!-- LINK TO DASHBOARD PAGE -->
          <button onclick="window.location.href='dashboard.html'" class="bg-gray-100 border px-3 py-1 rounded-lg text-sm font-bold hover:bg-gray-200">
            ⬅️ হোম
          </button>
          <h2 class="text-lg font-bold text-gray-800">সদস্য ব্যবস্থাপনা</h2>
        </div>
        <span class="text-sm font-bold text-gray-600 bg-gray-100 px-3 py-1 rounded-full" id="totalMembersCount">মোট সদস্য: ০</span>
      </div>

      <div id="adminMemberControls" class="flex flex-wrap gap-2 mb-4 hidden">
        <button onclick="openAddModal()" class="bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-1 hover:bg-gray-800 shadow-sm">➕ যোগ করুন</button>
        <button onclick="exportToExcel()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-1 hover:bg-emerald-700 shadow-sm">📥 এক্সেল এক্সপোর্ট</button>
        <button onclick="deleteSelectedMembers()" class="bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-1 hover:bg-red-700 shadow-sm">🗑️ সিলেক্টেড ডিলিট</button>
      </div>

      <div class="flex flex-col md:flex-row gap-2 mb-4">
        <input type="text" id="searchInput" onkeyup="filterMembers()" placeholder="নাম, মোবাইল, গ্রাম, পদ দিয়ে খুঁজুন..." class="w-full p-2.5 border rounded-lg text-sm focus:outline-none focus:border-orange-500" />
      </div>

      <div class="overflow-x-auto border rounded-lg">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-gray-100 text-gray-700 border-b">
              <th class="p-2.5 border-r text-center align-middle w-10 admin-only-col hidden">
                <input type="checkbox" id="selectAll" onclick="toggleSelectAll()" class="cursor-pointer w-4 h-4" />
              </th>
              <th class="p-2.5 border-r text-center align-middle">ID</th>
              <th class="p-2.5 border-r text-center align-middle">ছবি</th>
              <th class="p-2.5 border-r text-center align-middle">নাম</th>
              <th class="p-2.5 border-r text-center align-middle">গ্রাম</th>
              <th class="p-2.5 border-r text-center align-middle">পদ</th>
              <th class="p-2.5 border-r text-center align-middle">মোবাইল</th>
              <th class="p-2.5 border-r text-center align-middle">স্বাক্ষর</th>
              <th class="p-2.5 text-center align-middle">অ্যাকশন</th>
            </tr>
          </thead>
          <tbody id="memberTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Add Member Modal -->
  <div id="addMemberModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white w-full max-w-md p-6 rounded-xl shadow-lg max-h-[90vh] overflow-y-auto">
      <h3 id="modalTitle" class="text-lg font-bold text-orange-600 mb-4">নতুন সদস্য যুক্ত করুন</h3>
      <input type="hidden" id="editMemberDocId" />
      
      <label class="block text-xs font-semibold text-gray-600 mb-1">সদস্যের নাম *</label>
      <input type="text" id="newMemberName" class="w-full p-2.5 border rounded-lg mb-3 text-sm" />
      
      <label class="block text-xs font-semibold text-gray-600 mb-1">গ্রাম *</label>
      <input type="text" id="newMemberVillage" class="w-full p-2.5 border rounded-lg mb-3 text-sm" />
      
      <label class="block text-xs font-semibold text-gray-600 mb-1">সদস্য পদ</label>
      <select id="newMemberRole" class="w-full p-2.5 border rounded-lg mb-3 text-sm bg-white">
        <option value="সাধারণ সদস্য">সাধারণ সদস্য</option>
        <option value="সভাপতি">সভাপতি</option>
        <option value="সম্পাদক">সম্পাদক</option>
        <option value="কোষাধ্যক্ষ">কোষাধ্যক্ষ</option>
      </select>
      
      <label class="block text-xs font-semibold text-gray-600 mb-1">মোবাইল নম্বর</label>
      <input type="tel" id="newMemberMobile" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="w-full p-2.5 border rounded-lg mb-3 text-sm" />
      
      <label class="block text-xs font-semibold text-gray-600 mb-1">সদস্যের ছবি</label>
      <input type="file" onchange="processImage(this, 'photoPreview', 300, 300)" class="w-full p-2 border rounded-lg mb-2 text-xs bg-gray-50" />
      <img id="photoPreview" class="w-16 h-16 object-cover rounded-full border border-gray-300 hidden mx-auto mb-3" />
      
      <label class="block text-xs font-semibold text-gray-600 mb-1">স্বাক্ষর</label>
      <input type="file" onchange="processImage(this, 'sigPreview', 300, 100)" class="w-full p-2 border rounded-lg mb-2 text-xs bg-gray-50" />
      <img id="sigPreview" class="h-10 object-contain border border-gray-300 rounded hidden px-2 py-1 mx-auto mb-4" />
      
      <div class="flex justify-end gap-2">
        <button onclick="closeAddModal()" class="bg-gray-300 px-4 py-2 rounded-lg text-sm font-semibold">বাতিল</button>
        <button onclick="saveOrUpdateMember()" class="bg-orange-600 text-white px-4 py-2 rounded-lg text-sm font-bold">সেভ করুন</button>
      </div>
    </div>
  </div>

  <!-- ID Card Modal -->
  <div id="idCardModal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-50">
    <div id="idCardBox" class="bg-white w-[340px] h-[215px] rounded-xl shadow-2xl overflow-hidden border-2 border-orange-500 flex flex-col justify-between relative">
      <div class="bg-gradient-to-r from-orange-600 to-amber-600 text-white px-2 py-1 text-center">
        <h4 class="font-bold text-[11px] leading-tight">নেকড়ামারি সর্বজনীন দুর্গোৎসব কমিটি</h4>
      </div>
      <div class="px-3 py-1 flex items-center gap-3 bg-amber-50/20 my-auto">
        <img id="idCardPhoto" src="" class="w-[72px] h-[72px] object-cover rounded-full border-2 border-orange-500" />
        <div class="text-center flex-1">
          <h3 id="idCardName" class="text-xs font-bold text-gray-800"></h3>
          <p id="idCardRole" class="text-[9px] font-semibold text-orange-600 bg-orange-100 inline-block px-2 py-0.5 rounded-full"></p>
          <div class="mt-1 text-[9px] text-gray-700 space-y-0.5">
            <p><strong>আইডি:</strong> <span id="idCardAutoId"></span></p>
            <p><strong>গ্রাম:</strong> <span id="idCardVillage"></span></p>
            <p><strong>মোবাইল:</strong> <span id="idCardMobile"></span></p>
          </div>
        </div>
      </div>
    </div>
    <div class="absolute bottom-5 flex gap-2 no-print">
      <button onclick="window.print()" class="bg-blue-600 text-white px-4 py-1.5 rounded-lg text-xs font-bold">🖨️ প্রিন্ট</button>
      <button onclick="closeIdCardModal()" class="bg-gray-600 text-white px-4 py-1.5 rounded-lg text-xs font-bold">বন্ধ</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyByG-eBGnsUMX1zchs8sJV9MNZL-Sx0Nqs",
      authDomain: "durgapuja-2026.firebaseapp.com",
      projectId: "durgapuja-2026",
      storageBucket: "durgapuja-2026.firebasestorage.app",
      messagingSenderId: "625976130920",
      appId: "1:625976130920:web:60190b21f1c7563cdd2add",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let allMembersData = [];
    let processedPhotoBase64 = "";
    let processedSigBase64 = "";

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.currentUserRole = user.email === "bappasarkar1173@gmail.com" ? "admin" : "user";
        if(window.currentUserRole === "admin") {
          document.getElementById("adminMemberControls").classList.remove("hidden");
          document.querySelectorAll(".admin-only-col").forEach(col => col.classList.remove("hidden"));
        }
        loadMembers();
      } else {
        window.location.replace("index.html");
      }
    });

    function loadMembers() {
      onSnapshot(collection(db, "members"), (snapshot) => {
        allMembersData = [];
        snapshot.forEach((docSnap) => { allMembersData.push({ id: docSnap.id, ...docSnap.data() }); });
        allMembersData.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        allMembersData.forEach((m, idx) => (m.autoId = "M" + String(idx + 1).padStart(3, "0")));
        renderTable(allMembersData);
      });
    }

    window.renderTable = function(data) {
      const tbody = document.getElementById("memberTableBody");
      tbody.innerHTML = "";
      document.getElementById("totalMembersCount").innerText = `মোট সদস্য: ${data.length}`;
      data.forEach((member) => {
        const tr = document.createElement("tr");
        tr.className = "border-b hover:bg-gray-50";
        let actionButtons = `<button onclick="openIdCard('${member.id}')" class="bg-indigo-100 text-indigo-700 px-2 py-1 rounded text-xs">আইডি</button>`;
        if (window.currentUserRole === "admin") {
          actionButtons += `<button onclick="openEditModal('${member.id}')" class="bg-amber-100 text-amber-700 px-2 py-1 rounded text-xs ml-1">এডিট</button>
                            <button onclick="deleteMember('${member.id}')" class="bg-red-100 text-red-600 px-2 py-1 rounded text-xs ml-1">ডিলিট</button>`;
        }
        tr.innerHTML = `
          ${window.currentUserRole === "admin" ? `<td class="p-2.5 border-r text-center admin-only-col"><input type="checkbox" class="member-checkbox" value="${member.id}"></td>` : ""}
          <td class="p-2.5 border-r font-bold text-orange-600 text-center">${member.autoId}</td>
          <td class="p-2.5 border-r text-center"><img src="${member.photo || ''}" class="w-9 h-9 object-cover rounded-full mx-auto border" onerror="this.style.display='none'"></td>
          <td class="p-2.5 border-r font-medium text-gray-800 text-center">${member.name}</td>
          <td class="p-2.5 border-r text-gray-700 text-center">${member.village}</td>
          <td class="p-2.5 border-r text-gray-700 text-center">${member.role}</td>
          <td class="p-2.5 border-r text-gray-600 text-center">${member.mobile}</td>
          <td class="p-2.5 border-r text-center"><img src="${member.signature || ''}" class="h-6 object-contain mx-auto border px-1" onerror="this.style.display='none'"></td>
          <td class="p-2.5 text-center">${actionButtons}</td>
        `;
        tbody.appendChild(tr);
      });
    };

    // (এখানে আপনার image process, CRUD, ও Export ফাংশনগুলো আগের মতোই থাকবে, স্পেস বাঁচানোর জন্য মেইন লজিকটুকু দিয়েছি)
    
    window.openAddModal = function() {
      document.getElementById("addMemberModal").classList.remove("hidden");
    };
    window.closeAddModal = function() {
      document.getElementById("addMemberModal").classList.add("hidden");
    };
    window.openIdCard = function(id) {
      const member = allMembersData.find(m => m.id === id);
      if (!member) return;
      document.getElementById("idCardName").innerText = member.name;
      document.getElementById("idCardRole").innerText = member.role;
      document.getElementById("idCardAutoId").innerText = member.autoId;
      document.getElementById("idCardVillage").innerText = member.village;
      document.getElementById("idCardMobile").innerText = member.mobile;
      document.getElementById("idCardPhoto").src = member.photo || "https://via.placeholder.com/150";
      document.getElementById("idCardModal").classList.remove("hidden");
    };
    window.closeIdCardModal = function() {
      document.getElementById("idCardModal").classList.add("hidden");
    };
  </script>
</body>
</html>
