<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন - নেকড়ামারী সর্বজনীন দুর্গোৎসব কমিটি</title>
    <script src="https://cdn.tailwindcss.com"></script>

<script>
(() => {
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyByG-eBGnsUMX1zchs8sJV9MNZL-Sx0Nqs",
    authDomain: "durgapuja-2026.firebaseapp.com",
    projectId: "durgapuja-2026",
    storageBucket: "durgapuja-2026.firebasestorage.app",
    messagingSenderId: "625976130920",
    appId: "1:625976130920:web:60190b21f1c7563cdd2add"
  };
  const DEFAULT_COMMITTEE = {
    name: "নেকড়ামারী সর্বজনীন দুর্গোৎসব কমিটি",
    establishedYear: "2009",
    registrationNo: "S0014684",
    address: "সাং:- সহরা, পোস্ট:- আদিনা স্টেশন, থানা ও জেলা:- মালদা, পিন:- 732128",
    mobile: "9933371702}"
  };
  const DEFAULT_DEV = {
    name: "MANABENDRA NATH SARKAR",
    mobile: "9002652507",
    email: "manabendranathsarkar112@gmail.com"
  };

  function setIfExists(id, value, property = "textContent") {
    const el = document.getElementById(id);
    if (!el) return;
    if (property === "value" && document.activeElement === el) return;
    el[property] = value;
  }

  function applyCommitteeInfo(raw) {
    const d = { ...DEFAULT_COMMITTEE, ...(raw || {}) };
    const name = String(d.name || DEFAULT_COMMITTEE.name);
    const establishedYear = String(d.establishedYear || DEFAULT_COMMITTEE.establishedYear);
    const registrationNo = String(d.registrationNo || DEFAULT_COMMITTEE.registrationNo);
    const address = String(d.address || DEFAULT_COMMITTEE.address);
    const mobile = String(d.mobile || "");

    try { localStorage.setItem("pujaCommitteeInfo", JSON.stringify({ name, establishedYear, registrationNo, address, mobile })); } catch (_) {}

    setIfExists("committeePageHeading", name);
    setIfExists("committeeEstablishedYear", establishedYear);
    setIfExists("committeeRegistrationNo", registrationNo);
    setIfExists("committeeAddress", address);
    setIfExists("committeeMobile", mobile);
    const mobileLink = document.getElementById("committeeMobileLink");
    if (mobileLink) mobileLink.href = "tel:" + mobile.replace(/[^0-9+]/g, "");

    setIfExists("committeeInfoName", name, "value");
    setIfExists("committeeInfoEstablished", establishedYear, "value");
    setIfExists("committeeInfoReg", registrationNo, "value");
    setIfExists("committeeInfoAddress", address, "value");
    setIfExists("committeeInfoMobile", mobile, "value");
  }

  function applyDeveloperInfo(raw) {
    const d = {
      name: String(raw?.name || DEFAULT_DEV.name),
      mobile: String(raw?.mobile || DEFAULT_DEV.mobile),
      email: String(raw?.email || DEFAULT_DEV.email)
    };
    try {
      localStorage.setItem("pujaDevData", JSON.stringify(d));
      localStorage.setItem("pujaDevName", d.name);
      localStorage.setItem("pujaDevMobile", d.mobile);
      localStorage.setItem("pujaDevEmail", d.email);
    } catch (_) {}

    setIfExists("devNameInput", d.name, "value");
    setIfExists("devMobileInput", d.mobile, "value");
    setIfExists("devEmailInput", d.email, "value");
    setIfExists("popDevName", d.name);
    setIfExists("popDevMobile", d.mobile);
    setIfExists("popDevEmail", d.email);
    setIfExists("devName", d.name);
    setIfExists("devPhone", d.mobile);
    setIfExists("devEmail", d.email);

    const a = document.getElementById("popDevMobile");
    if (a) a.href = "tel:" + d.mobile.replace(/[^0-9+]/g, "");
    const p = document.getElementById("devPhone");
    if (p) p.href = "tel:" + d.mobile.replace(/[^0-9+]/g, "");
    const e = document.getElementById("popDevEmail");
    if (e) e.href = "mailto:" + d.email;
    const de = document.getElementById("devEmail");
    if (de) de.href = "mailto:" + d.email;
  }

  function readLocalCommittee() {
    try { return JSON.parse(localStorage.getItem("pujaCommitteeInfo") || "null") || DEFAULT_COMMITTEE; }
    catch (_) { return DEFAULT_COMMITTEE; }
  }

  function readLocalDev() {
    try { return JSON.parse(localStorage.getItem("pujaDevData") || "null") || DEFAULT_DEV; }
    catch (_) { return DEFAULT_DEV; }
  }

  applyCommitteeInfo(readLocalCommittee());
  applyDeveloperInfo(readLocalDev());

  Promise.all([
    import("https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js"),
    import("https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js")
  ]).then(async ([appMod, authMod, fsMod]) => {
    const { getApps, getApp, initializeApp } = appMod;
    const { getAuth, onAuthStateChanged } = authMod;
    const { getFirestore, doc, getDoc, getDocs, collection, onSnapshot, setDoc, enableIndexedDbPersistence } = fsMod;

    let app;
    try { app = getApps().length ? getApp() : initializeApp(FIREBASE_CONFIG); }
    catch (e) { app = getApps().length ? getApp() : initializeApp(FIREBASE_CONFIG); }
    const auth = getAuth(app);
    const db = getFirestore(app);
        // Firestore-এর IndexedDB persistence চালু: একবার ডাটা এলে পরের page load-এ
        // browser cache থেকেই দ্রুত পাওয়া যাবে।
        try { enableIndexedDbPersistence(db).catch(() => {}); } catch (_) {}

        const DPMS_ADMIN_EMAIL = "bappasarkar1173@gmail.com";

        function dpmsSetSplashStatus(text) {
            const el = document.getElementById("dpmsSplashStatus");
            if (el) el.textContent = text;
        }

        function dpmsShowSplash(profile, committeeName) {
            const splash = document.getElementById("dpmsSplash");
            if (!splash) return;
            const roleEl = document.getElementById("dpmsSplashRole");
            const nameEl = document.getElementById("dpmsSplashName");
            const committeeEl = document.getElementById("dpmsSplashCommittee");
            const role = profile?.role === "admin" ? "Admin" : (profile?.role || "সাধারণ User");
            const name = String(profile?.name || "ব্যবহারকারী").trim();
            if (roleEl) roleEl.textContent = `রোল: ${role}`;
            if (nameEl) nameEl.textContent = name;
            if (committeeEl && committeeName) {
                const n = String(committeeName).trim();
                committeeEl.innerHTML = n.length > 24 ? n.replace(" সর্বজনীন ", " সর্বজনীন<br>") : n;
            }
            splash.classList.add("dpms-splash-active");
            splash.setAttribute("aria-hidden", "false");
        }

        function dpmsSaveJSON(key, value) {
            try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {}
        }

        async function dpmsWarmDashboardData(signedUser, profile) {
            const collections = [
                "members", "subscriptions", "expenses", "bookings", "sales",
                "committee", "daitobonton", "treasurer", "payments", "past_documents"
            ];
            let done = 0;
            const total = collections.length + 2;
            const bump = (label) => {
                done++;
                dpmsSetSplashStatus(`${label}  •  ${Math.min(100, Math.round(done / total * 100))}%`);
            };

            // Profile/role আগে cache করা হয়—splash-এ যা দেখানো হচ্ছে সেটাই dashboard-এও ব্যবহার হবে।
            dpmsSaveJSON("dpmsCurrentProfile", {
                uid: signedUser.uid,
                name: String(profile?.name || signedUser.displayName || signedUser.email?.split("@")[0] || "ব্যবহারকারী"),
                role: profile?.role || "user",
                permissions: Array.isArray(profile?.permissions) ? profile.permissions : [],
                email: signedUser.email || ""
            });
            bump("প্রোফাইল প্রস্তুত");

            // Committee info cache
            try {
                const cSnap = await getDoc(doc(db, "settings", "committeeInfo"));
                const c = cSnap.exists() ? cSnap.data() : {};
                if (c && Object.keys(c).length) dpmsSaveJSON("pujaCommitteeInfo", c);
            } catch (_) {}
            bump("কমিটির তথ্য প্রস্তুত");

            // সব বড় collection একসাথে warm করা হচ্ছে। Firestore persistence থাকায় এগুলো
            // IndexedDB-তে থাকে; আলাদা page খুললে আবার network থেকে পুরো ডাটা টানার প্রয়োজন হয় না।
            const warmupPromise = Promise.allSettled(collections.map(async (name) => {
                try {
                    await getDocs(collection(db, name));
                } catch (err) {
                    // User permission অনুযায়ী কোনো collection না পড়তে পারলে splash আটকে থাকবে না।
                    console.debug("Warm-up skipped:", name, err?.code || err);
                } finally {
                    bump(`${name} প্রস্তুত`);
                }
            }));
            const safetyTimeout = new Promise(resolve => setTimeout(resolve, 18000));
            await Promise.race([warmupPromise, safetyTimeout]);

            // Dashboard-এর summary localStorage-এও রাখা হচ্ছে যাতে প্রথম paint আরও দ্রুত হয়।
            try {
                const [members, subscriptions, expenses, bookings, sales, committee] = await Promise.all([
                    getDocs(collection(db, "members")).catch(() => null),
                    getDocs(collection(db, "subscriptions")).catch(() => null),
                    getDocs(collection(db, "expenses")).catch(() => null),
                    getDocs(collection(db, "bookings")).catch(() => null),
                    getDocs(collection(db, "sales")).catch(() => null),
                    getDocs(collection(db, "committee")).catch(() => null)
                ]);

                let expenseTotal = 0, bookingTotal = 0, salesTotal = 0, subscriptionTotal = 0;
                expenses?.forEach(s => { const d=s.data(); expenseTotal += Number(d.spent ?? d.amount ?? 0) || 0; });
                bookings?.forEach(s => { const d=s.data(); bookingTotal += Number(d.quantity ?? d.tickets ?? d.ticketCount ?? d.count ?? 1) || 1; });
                sales?.forEach(s => { const d=s.data(); salesTotal += Number(d.quantity ?? d.tickets ?? d.ticketCount ?? d.count ?? 1) || 1; });
                subscriptions?.forEach(s => { subscriptionTotal += Number(s.data().amount) || 0; });

                const executives = [];
                committee?.forEach(s => {
                    const d=s.data();
                    executives.push({name:d.name||d.memberName||"নামহীন",designation:d.designation||d.post||d.role||d.position||"",mobile:d.mobile||d.phone||d.contact||""});
                });
                members?.forEach(s => {
                    const d=s.data();
                    const post=d.designation||d.post||d.role||d.position||"";
                    if(post && post.trim() && post!=="সাধারণ সদস্য" && post!=="সদস্য" && !executives.some(x=>(x.name||"").trim()===(d.name||"").trim())){
                        executives.push({name:d.name||"নামহীন",designation:post,mobile:d.mobile||d.phone||d.contact||""});
                    }
                });

                dpmsSaveJSON("dpmsDashboardCache", {
                    updatedAt: Date.now(),
                    membersCount: members?.size || 0,
                    expenseTotal, bookingTotal, salesTotal, subscriptionTotal, executives
                });
            } catch (_) {}
            bump("ড্যাশবোর্ডের তথ্য প্রস্তুত");

            // Splash-এ বাস্তবে যতগুলো কাজ সম্পন্ন হয়েছে, সেই অনুযায়ী percentage দেখানো হবে।
            dpmsSetSplashStatus(`লোড হচ্ছে... ${Math.min(100, Math.round(done / total * 100))}%`);
            document.getElementById("dpmsSplash")?.classList.add("dpms-splash-ready");
        }

        async function dpmsOpenDashboardWithSplash(signedUser) {
            let profile = {};
            try {
                const snap = await getDoc(doc(db, "app_users", signedUser.uid));
                if (snap.exists()) profile = snap.data() || {};
            } catch (_) {}

            const role = (signedUser.email || "").toLowerCase() === DPMS_ADMIN_EMAIL.toLowerCase()
                ? "admin"
                : (profile.role || "user");
            profile = {...profile, role};

            let committeeName = "নেকড়ামারী সর্বজনীন দুর্গোৎসব কমিটি";
            try {
                const local = JSON.parse(localStorage.getItem("pujaCommitteeInfo") || "null");
                if (local?.name) committeeName = local.name;
            } catch (_) {}

            dpmsShowSplash(profile, committeeName);
            await dpmsWarmDashboardData(signedUser, profile);

            await new Promise(resolve => setTimeout(resolve, 650));
            // Splash শেষ হওয়ার সঙ্গে সঙ্গেই Dashboard-এ যাওয়া হবে।
            // Splash fade-out করা হবে না—কারণ fade-out করলে নিচের Login form
            // কয়েক মিলিসেকেন্ডের জন্য দেখা যায়।
            window.location.replace("dashboard.html");
        }


    let readyResolve;
    window.__pujaGlobalReady = new Promise(resolve => { readyResolve = resolve; });

    window.__saveDeveloperDetailsToCloud = async function(dev) {
      const ctx = await window.__pujaGlobalReady;
      await setDoc(doc(ctx.db, "settings", "developerInfo"), {
        name: String(dev?.name || "").trim(),
        mobile: String(dev?.mobile || "").trim(),
        email: String(dev?.email || "").trim(),
        updatedAt: Date.now()
      }, { merge: true });
      applyDeveloperInfo(dev);
    };

    window.__saveCommitteeInfoToCloud = async function(info) {
      const ctx = await window.__pujaGlobalReady;
      const data = {
        name: String(info?.name || DEFAULT_COMMITTEE.name).trim() || DEFAULT_COMMITTEE.name,
        establishedYear: String(info?.establishedYear || DEFAULT_COMMITTEE.establishedYear).trim() || DEFAULT_COMMITTEE.establishedYear,
        registrationNo: String(info?.registrationNo || DEFAULT_COMMITTEE.registrationNo).trim() || DEFAULT_COMMITTEE.registrationNo,
        address: String(info?.address || DEFAULT_COMMITTEE.address).trim() || DEFAULT_COMMITTEE.address,
        mobile: String(info?.mobile || "").trim()
      };
      await setDoc(doc(ctx.db, "settings", "committeeInfo"), { ...data, updatedAt: Date.now() }, { merge: true });

      // Keep the already-existing per-page heading system in sync with the common committee name.
      const allNames = {
        dashboard: data.name, members: data.name, chada: data.name,
        expense: data.name, booking: data.name, sales: data.name,
        treasury: data.name, daitobonton: data.name, settings: data.name
      };
      await setDoc(doc(ctx.db, "settings", "committeeNames"), { ...allNames, updatedAt: Date.now() }, { merge: true });
      applyCommitteeInfo(data);
      try { localStorage.setItem("pujaCommitteeNames", JSON.stringify(allNames)); } catch (_) {}
    };

    // Override the older heading helper so its save also uses the authenticated Firebase app.
    window.__saveCommitteeNamesToCloud = async function(names) {
      const ctx = await window.__pujaGlobalReady;
      await setDoc(doc(ctx.db, "settings", "committeeNames"), { ...(names || {}), updatedAt: Date.now() }, { merge: true });
    };

    onAuthStateChanged(auth, user => {
      if (!user) return;
      readyResolve({ auth, db, user });

      onSnapshot(doc(db, "settings", "developerInfo"), snap => {
        applyDeveloperInfo(snap.exists() ? snap.data() : DEFAULT_DEV);
      }, err => console.warn("Developer details sync failed:", err));

      onSnapshot(doc(db, "settings", "committeeInfo"), snap => {
        applyCommitteeInfo(snap.exists() ? snap.data() : readLocalCommittee());
      }, err => console.warn("Committee info sync failed:", err));
    });
  }).catch(err => console.error("Global settings sync init failed:", err));

  window.saveCommitteeInfo = async function(e) {
    if (e) e.preventDefault();
    const info = {
      name: document.getElementById("committeeInfoName")?.value || "",
      establishedYear: document.getElementById("committeeInfoEstablished")?.value || "",
      registrationNo: document.getElementById("committeeInfoReg")?.value || "",
      address: document.getElementById("committeeInfoAddress")?.value || "",
      mobile: document.getElementById("committeeInfoMobile")?.value || ""
    };
    try {
      if (!window.__saveCommitteeInfoToCloud) throw new Error("cloud_not_ready");
      await window.__saveCommitteeInfoToCloud(info);
      alert("কমিটির তথ্য সেভ হয়েছে। এখন সব পেজে একই তথ্য দেখা যাবে।");
    } catch (err) {
      console.error("Committee info cloud save failed:", err);
      alert("কমিটির তথ্য সেভ হয়নি। ইন্টারনেট/Firestore সংযোগ পরীক্ষা করুন।");
    }
  };
})();
</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style id="dpms-splash-style">
  #dpmsSplash{
    position:fixed; inset:0; z-index:99999; display:none; overflow:hidden;
    background:#3d0000 url("splash-bg.png") center top/cover no-repeat;
    color:#fff; font-family:inherit;
  }
  #dpmsSplash.dpms-splash-active{display:flex;}
  .dpms-splash-vignette{
    position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(to bottom,rgba(35,0,0,.03) 0%,rgba(45,0,0,.10) 42%,rgba(50,0,0,.45) 62%,rgba(35,0,0,.72) 100%);
  }
  .dpms-splash-content{
    position:relative; z-index:2; width:100%; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center;
    justify-content:flex-end; text-align:center;
    padding:4vh 18px 7vh; box-sizing:border-box;
  }
  .dpms-splash-welcome{
    width:min(68vw,520px); max-height:170px; margin:0 auto 18px;
    display:flex; justify-content:center; align-items:center;
    position:relative; overflow:visible;
    opacity:0; transform:translateY(18px) scale(.78);
    filter:drop-shadow(0 3px 10px rgba(255,196,35,.16));
    animation:dpmsWelcomeLogoIn 1.15s cubic-bezier(.2,.82,.2,1) .08s forwards,
              dpmsWelcomeGlow 2.8s ease-in-out 1.25s infinite;
  }
  .dpms-splash-welcome::after{
    content:""; position:absolute; top:0; bottom:0; left:-35%; width:24%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.38),transparent);
    transform:skewX(-18deg); opacity:0; pointer-events:none;
    animation:dpmsWelcomeShine 1.2s ease 1.15s forwards;
  }
  .dpms-splash-welcome img{
    display:block; width:100%; max-width:520px; max-height:170px; height:auto;
    object-fit:contain; background:transparent;
  }
  .dpms-splash-committee{
    max-width:92%; color:#fff6e0; font-size:clamp(17px,4.8vw,25px);
    line-height:1.35; font-weight:800;
    text-shadow:0 2px 10px rgba(0,0,0,.55);
    opacity:0; transform:translateY(12px);
    animation:dpmsTextIn .75s ease .55s forwards;
  }
  .dpms-splash-user{
    margin-top:14px; min-width:190px; max-width:92%;
    padding:10px 18px 11px; border:1px solid rgba(255,216,74,.62);
    border-radius:18px; background:rgba(55,0,0,.52);
    box-shadow:0 8px 25px rgba(0,0,0,.25), inset 0 0 18px rgba(255,216,74,.06);
    opacity:0; transform:translateY(12px);
    animation:dpmsTextIn .75s ease .78s forwards;
  }
  .dpms-splash-role{
    color:#ffd84a; font-size:12px; font-weight:900; letter-spacing:.4px;
    margin-bottom:4px;
  }
  .dpms-splash-name{
    color:#fff; font-size:clamp(16px,4.5vw,21px); font-weight:800;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .dpms-splash-loader{
    margin-top:22px; display:flex; flex-direction:column; align-items:center; gap:9px;
    opacity:0; animation:dpmsTextIn .7s ease 1.02s forwards;
  }
  .dpms-splash-spinner{
    width:38px; height:38px; border-radius:50%;
    border:4px solid rgba(255,255,255,.22);
    border-top-color:#ffd84a; border-right-color:#ff9f1a;
    animation:dpmsSpin 1s linear infinite;
  }
  #dpmsSplashStatus{font-size:11px;color:rgba(255,255,255,.88);font-weight:700}
  .dpms-splash-ready #dpmsSplashStatus{color:#ffe89a}
  #dpmsSplash.dpms-splash-leaving .dpms-splash-content{
    animation:dpmsSplashOut .55s ease forwards;
  }
  #dpmsSplash.dpms-splash-leaving{animation:dpmsFadeOut .65s ease forwards;}
  @keyframes dpmsWelcomeLogoIn{
    0%{opacity:0;transform:translateY(18px) scale(.78);filter:drop-shadow(0 0 0 rgba(255,216,74,0))}
    60%{opacity:1;transform:translateY(-2px) scale(1.04);filter:drop-shadow(0 0 18px rgba(255,216,74,.34))}
    100%{opacity:1;transform:translateY(0) scale(1);filter:drop-shadow(0 3px 10px rgba(255,196,35,.16))}
  }
  @keyframes dpmsWelcomeGlow{
    0%,100%{filter:drop-shadow(0 3px 10px rgba(255,196,35,.16))}
    50%{filter:drop-shadow(0 4px 18px rgba(255,216,74,.34))}
  }
  @keyframes dpmsWelcomeShine{
    0%{left:-35%;opacity:0}
    15%{opacity:1}
    100%{left:115%;opacity:0}
  }
  @keyframes dpmsTextIn{to{opacity:1;transform:translateY(0)}}
  @keyframes dpmsSpin{to{transform:rotate(360deg)}}
  @keyframes dpmsFadeOut{to{opacity:0}}
  @keyframes dpmsSplashOut{to{transform:scale(1.025);opacity:0}}
  @media (prefers-reduced-motion:reduce){
    .dpms-splash-welcome,.dpms-splash-committee,.dpms-splash-user,.dpms-splash-loader{animation:none;opacity:1;transform:none;filter:none}
    .dpms-splash-welcome::after{animation:none;opacity:0}
    .dpms-splash-spinner{animation:none}
  }
</style>
</head>

<div id="dpmsSplash" aria-hidden="true">
  <div class="dpms-splash-vignette"></div>

<body class="bg-[#FDFBF7] min-h-screen flex flex-col items-center justify-center p-4 font-sans">

        </div>
    </div>

    <!-- মেইন কার্ড ডিজাইন -->
    <div class="bg-white w-full max-w-md p-6 sm:p-8 rounded-3xl shadow-xl border border-amber-100 relative">
        
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1.5">ইমেইল</label>
                <input type="email" id="email" required placeholder="আপনার ইমেইল লিখুন" class="w-full p-3.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 bg-gray-50/30">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1.5">পাসওয়ার্ড</label>
                <div class="relative">
                    <input type="password" id="password" required placeholder="আপনার পাসওয়ার্ড লিখুন" class="w-full p-3.5 pr-10 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 bg-gray-50/30">
                    <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none">
                        <i id="eyeIcon" class="fa-regular fa-eye text-base"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="loginBtn" class="w-full bg-gradient-to-r from-orange-600 via-amber-600 to-orange-600 text-white p-3.5 rounded-xl text-sm font-bold shadow-md hover:opacity-95 transition duration-200 mt-2">

        <div id="errorMsg" class="mt-3 text-center text-xs text-red-600 font-semibold hidden"></div>

        <!-- স্লোগান -->
        <div class="mt-6 pt-5 border-t border-gray-100 text-center">
            <p class="text-xs font-medium text-amber-900/80 tracking-wide">ঐতিহ্য, সম্প্রীতি ও আনন্দ উদযাপনের এক অনন্য প্রয়াস</p>
        </div>

    <!-- Firebase ও স্ক্রিপ্ট লজিক -->
    <script type="module">
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, setPersistence, browserLocalPersistence, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc, getDocs, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        window.togglePassword = function() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        const firebaseConfig = {
            apiKey: "AIzaSyByG-eBGnsUMX1zchs8sJV9MNZL-Sx0Nqs",
            authDomain: "durgapuja-2026.firebaseapp.com",
            projectId: "durgapuja-2026",
            storageBucket: "durgapuja-2026.firebasestorage.app",
            messagingSenderId: "625976130920",
            appId: "1:625976130920:web:60190b21f1c7563cdd2add"
        };

        // উপরের global DPMS loader আগে Firebase initialize করে ফেলতে পারে।
        // তাই একই page-এ দ্বিতীয়বার initializeApp() করে FirebaseError না ঘটিয়ে
        // existing app থাকলে সেটিই ব্যবহার করা হবে।
        const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // If dashboard.html briefly sends the browser back here while Firebase
        // is restoring the just-created session, resume the dashboard instead
        // of showing the login form again. This is only active for a fresh
        // login handoff and expires automatically.
        let dpmsLoginInProgress = false;
        let dpmsResumeRedirectDone = false;

        setTimeout(() => {
            if (dpmsLoginInProgress || dpmsResumeRedirectDone) return;
            try {
                const raw = sessionStorage.getItem("dpmsLoginHandoff");
                if (!raw) return;
                const handoff = JSON.parse(raw);
                const age = Date.now() - Number(handoff?.createdAt || 0);
                if (age < 30000 && handoff?.uid) {
                    onAuthStateChanged(auth, user => {
                        if (!user || dpmsLoginInProgress || dpmsResumeRedirectDone) return;
                        if (user.uid !== handoff.uid) return;
                        dpmsResumeRedirectDone = true;
                        window.location.replace("dashboard.html");
                    });
                } else {
                    sessionStorage.removeItem("dpmsLoginHandoff");
                    sessionStorage.removeItem("dpmsAuthHandoff");
                }
            } catch (_) {
                sessionStorage.removeItem("dpmsLoginHandoff");
                sessionStorage.removeItem("dpmsAuthHandoff");
            }
        }, 350);

        // Splash/data preload helpers are defined inside this executable module script.
        // (The earlier global block is inside the Tailwind <script src=...> tag and browsers ignore its inline body.)
        const DPMS_ADMIN_EMAIL = "bappasarkar1173@gmail.com";

        function dpmsSetSplashStatus(text) {
            const el = document.getElementById("dpmsSplashStatus");
            if (el) el.textContent = text;
        }

        function dpmsSaveJSON(key, value) {
            try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {}
        }

        function dpmsShowSplash(profile, committeeName) {
            const splash = document.getElementById("dpmsSplash");
            if (!splash) return;
            const roleEl = document.getElementById("dpmsSplashRole");
            const nameEl = document.getElementById("dpmsSplashName");
            const committeeEl = document.getElementById("dpmsSplashCommittee");
            const role = String(profile?.role || "user").toLowerCase() === "admin" ? "Admin" : "সাধারণ User";
            const name = String(profile?.name || "ব্যবহারকারী").trim();
            if (roleEl) roleEl.textContent = `রোল: ${role}`;
            if (nameEl) nameEl.textContent = name;
            if (committeeEl && committeeName) {
                const n = String(committeeName).trim();
                committeeEl.innerHTML = n.length > 24 ? n.replace(" সর্বজনীন ", " সর্বজনীন<br>") : n;
            }
            splash.classList.add("dpms-splash-active");
            splash.setAttribute("aria-hidden", "false");
        }

        async function dpmsWarmDashboardData(signedUser, profile) {
            // Profile name from Settings -> Profile Information is the source shown on splash.
            dpmsSaveJSON("dpmsCurrentProfile", {
                uid: signedUser.uid,
                name: String(profile?.name || signedUser.displayName || signedUser.email?.split("@")[0] || "ব্যবহারকারী"),
                role: profile?.role || "user",
                permissions: Array.isArray(profile?.permissions) ? profile.permissions : [],
                email: signedUser.email || ""
            });

            const collections = [
                "members", "subscriptions", "expenses", "bookings", "sales",
                "committee", "daitobonton", "treasurer", "payments", "past_documents"
            ];
            let done = 0;
            const total = collections.length + 2;
            const bump = (label) => {
                done++;
                dpmsSetSplashStatus(`${label} • ${Math.min(100, Math.round(done / total * 100))}%`);
            };
            bump("প্রোফাইল প্রস্তুত");

            try {
                const cSnap = await getDoc(doc(db, "settings", "committeeInfo"));
                if (cSnap.exists()) {
                    const c = cSnap.data() || {};
                    if (Object.keys(c).length) dpmsSaveJSON("pujaCommitteeInfo", c);
                }
            } catch (_) {}
            bump("কমিটির তথ্য প্রস্তুত");

            const warmup = Promise.allSettled(collections.map(async name => {
                try { await getDocs(collection(db, name)); }
                catch (e) { console.debug("Warm-up skipped:", name, e?.code || e); }
                finally { bump(`${name} প্রস্তুত`); }
            }));
            await Promise.race([warmup, new Promise(r => setTimeout(r, 8800))]);

            // Splash-এ শুধু loading percentage দেখানো হবে; Dashboard-এর নাম আর দেখানো হবে না।
            const loadedPercent = Math.min(100, Math.round(done / total * 100));
            dpmsSetSplashStatus(`লোড হচ্ছে... ${loadedPercent}%`);
            document.getElementById("dpmsSplash")?.classList.add("dpms-splash-ready");
        }

        async function dpmsOpenDashboardWithSplash(signedUser) {
            let profile = {};
            try {
                const snap = await getDoc(doc(db, "app_users", signedUser.uid));
                if (snap.exists()) profile = snap.data() || {};
            } catch (e) {
                console.warn("Profile read skipped:", e?.code || e);
            }

            const role = (signedUser.email || "").toLowerCase() === DPMS_ADMIN_EMAIL.toLowerCase()
                ? "admin" : (profile.role || "user");
            profile = { ...profile, role };

            let committeeName = "নেকড়ামারী সর্বজনীন দুর্গোৎসব কমিটি";
            try {
                const local = JSON.parse(localStorage.getItem("pujaCommitteeInfo") || "null");
                if (local?.name) committeeName = local.name;
            } catch (_) {}

            // Splash screen-কে অন্তত নির্দিষ্ট সময় দৃশ্যমান রাখা হচ্ছে, যাতে
            // ব্যবহারকারী loading animation দেখতে পান এবং dashboard-এর জন্য auth handoff
            // প্রস্তুত হওয়ার সময় পায়। অন্য কোনো data/login logic পরিবর্তন করা হয়নি।
            const splashStartedAt = Date.now();
            dpmsShowSplash(profile, committeeName);

            // Dashboard-এ যাওয়ার আগে authenticated session handoff marker রাখা হচ্ছে।
            // এতে dashboard page auth state restore হওয়ার আগেই ভুল করে index.html-এ
            // ফিরে যাবে না।
            try {
                sessionStorage.setItem("dpmsLoginHandoff", JSON.stringify({
                    uid: signedUser.uid,
                    createdAt: Date.now(),
                    source: "login"
                }));
                sessionStorage.setItem("dpmsAuthHandoff", "1");
            } catch (_) {}

            await dpmsWarmDashboardData(signedUser, profile);

            // Splash screen: fixed 10 seconds total (including the fade-out).
            // If data loads early, the remaining time is simply used to keep the splash visible.
            const targetBeforeFade = 9400;
            const elapsedSinceSplashStart = Date.now() - splashStartedAt;
            const remainingBeforeFade = Math.max(0, targetBeforeFade - elapsedSinceSplashStart);
            if (remainingBeforeFade) {
                await new Promise(r => setTimeout(r, remainingBeforeFade));
            }

            // Splash শেষ → একবারেই Dashboard। Login page reveal করা যাবে না।
            window.location.replace("dashboard.html");
        }

        window.handleLogin = async function(event) {
            event.preventDefault();
            dpmsLoginInProgress = true;
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');

            loginBtn.innerText = "লগইন হচ্ছে...";
            loginBtn.disabled = true;
            errorMsg.classList.add('hidden');

            try {
                await setPersistence(auth, browserLocalPersistence);
                const credential = await signInWithEmailAndPassword(auth, email, password);
                // প্রকৃত লগইন-টাইমে সব ব্যবহারকারীর ইতিহাস একবারই সংরক্ষণ করা হবে।
                try {
                    const signedUser = credential.user;
                    let profile = {};
                    try {
                        const snap = await getDoc(doc(db, "app_users", signedUser.uid));
                        if (snap.exists()) profile = snap.data() || {};
                    } catch (_) {}
                    await addDoc(collection(db, "login_history"), {
                        userId: signedUser.uid,
                        email: signedUser.email || email,
                        name: (profile.name || "নাম দেওয়া নেই").trim(),
                        timestamp: Date.now(),
                        device: navigator.userAgent
                    });
                } catch (historyError) {
                    console.warn("Login history save failed:", historyError);
                }
                await dpmsOpenDashboardWithSplash(credential.user);
            } catch (error) {
                console.error("DPMS login error:", error);
                const code = String(error?.code || "");
                if (code === "auth/invalid-credential" || code === "auth/wrong-password" || code === "auth/user-not-found" || code === "auth/invalid-email") {
                    errorMsg.innerText = "ভুল ইমেইল বা পাসওয়ার্ড দেওয়া হয়েছে!";
                } else {
                    errorMsg.innerText = "লগইন সম্পন্ন হয়নি। আবার চেষ্টা করুন।";
                }
                errorMsg.classList.remove('hidden');
                loginBtn.innerText = "লগইন করুন";
                loginBtn.disabled = false;
            }
        }
    </script>
